const pick = (a) => a[Math.floor(Math.random() * a.length)];
// scarta i passi di castigo/condanna: la lista è "ispirazionale"
const NEG = /fuoco|stagno|geenna|inferno|collera|\bira\b|castig|maledi|perdizion|vendett|distrugg|stermin|uccid|abomin|puniz|tormento/i;

async function randomVerse() {
  for (let i = 0; i < 3; i++) {
    const r = await fetch(`${API}?query=${pick(REFS)}&version=CEI2008&return=json`);
    const d = await r.json();
    if (d.errors && d.errors.some((e) => e.errNum === 12)) throw new Error("busy");
    const verses = d.results.filter((v) => v.text.trim());
    if (verses.length && !verses.some((v) => NEG.test(v.text))) return verses;
  }
  throw new Error("nessun versetto");
}

async function show() {
  const t = document.getElementById("text"), ref = document.getElementById("ref");
  t.textContent = "…"; ref.textContent = "";
  try {
    const v = await randomVerse();
    const [a, b] = [v[0], v[v.length - 1]];
    t.textContent = v.map((x) => x.text).join(" ");
    ref.textContent = `${a.book} ${a.chapter},${a.verse}${b === a ? "" : "-" + b.verse}`;
  } catch (e) {
    t.textContent = e.message === "busy" ? "Servizio momentaneamente occupato: riprova tra un minuto." : "Connessione assente, riprova.";
  }
}
document.getElementById("again").onclick = show;
show();
