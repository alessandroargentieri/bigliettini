mato»."],["Isaia 44,24","Dice il Signore, che ti ha riscattato e ti ha formato fin dal seno materno: «Sono io, il Signore, che ho fatto tutto, che ho dispiegato i cieli da solo, ho disteso la terra; chi era con me?"],["Isaia 46,10","Io dal principio annuncio la fine e, molto prima, quanto non è stato ancora compiuto; sono colui che dice: «Il mio progetto resta valido, io compirò ogni mia volontà!»."],["Isaia 46,3-4","Ascoltatemi, casa di Giacobbe, tutto il resto della casa d'Israele; voi, portati da me fin dal seno materno, sorretti fin dal grembo. Fino alla vostra vecchiaia io sarò sempre lo stesso, io vi porterò fino alla canizie. Come ho già fatto, così io vi sosterrò, vi porterò e vi salverò."],["Isaia 49,13","Giubilate, o cieli, rallégrati, o terra, gridate di gioia, o monti, perché il Signore consola il suo popolo e ha misericordia dei suoi poveri."],["Isaia 49,15","Si dimentica forse una donna del suo bambino, così da non commuoversi per il figlio delle sue viscere? Anche se costoro si dimenticassero, io invece non ti dimenticherò mai."],["Isaia 49,6","e ha detto: «È troppo poco che tu sia mio servo per restaurare le tribù di Giacobbe e ricondurre i superstiti d'Israele. Io ti renderò luce delle nazioni, perché porti la mia salvezza fino all'estremità della terra»."],["Isaia 51,12","Io, io sono il vostro consolatore. Chi sei tu perché tu tema uomini che muoiono e un figlio dell'uomo che avrà la sorte dell'erba?"],["Isaia 53,5","Egli è stato trafitto per le nostre colpe, schiacciato per le nostre iniquità. Il castigo che ci dà salvezza si è abbattuto su di lui; per le sue piaghe noi siamo stati guariti."],["Isaia 54,13","Tutti i tuoi figli saranno discepoli del Signore, grande sarà la prosperità dei tuoi figli;"],["Isaia 55,11","così sarà della mia parola uscita dalla mia bocca: non ritornerà a me senza effetto, senza aver operato ciò che desidero e senza aver compiuto ciò per cui l'ho mandata."],["Isaia 55,7","L'empio abbandoni la sua via e l'uomo iniquo i suoi pensieri; ritorni al Signore che avrà misericordia di lui e al nostro Dio che largamente perdona."],["Isaia 55,8","Perché i miei pensieri non sono i vostri pensieri, le vostre vie non sono le mie vie. Oracolo del Signore."],["Isaia 58,10-11","se aprirai il tuo cuore all'affamato, se sazierai l'afflitto di cuore, allora brillerà fra le tenebre la tua luce, la tua tenebra sarà come il meriggio. Ti guiderà sempre il Signore, ti sazierà in terreni aridi, rinvigorirà le tue ossa; sarai come un giardino irrigato e come una sorgente le cui acque non inaridiscono."],["Isaia 58,8","Allora la tua luce sorgerà come l'aurora, la tua ferita si rimarginerà presto. Davanti a te camminerà la tua giustizia, la gloria del Signore ti seguirà."],["Isaia 6,8","Poi io udii la voce del Signore che diceva: «Chi manderò e chi andrà per noi?». E io risposi: «Eccomi, manda me!»."],["Isaia 60,1","Àlzati, rivestiti di luce, perché viene la tua luce, la gloria del Signore brilla sopra di te."],["Isaia 61,1","Lo spirito del Signore Dio è su di me, perché il Signore mi ha consacrato con l'unzione; mi ha mandato a portare il lieto annuncio ai miseri, a fasciare le piaghe dei cuori spezzati, a proclamare la libertà degli schiavi, la scarcerazione dei prigionieri,"],["Isaia 61,10","Io gioisco pienamente nel Signore, la mia anima esulta nel mio Dio, perché mi ha rivestito delle vesti della salvezza, mi ha avvolto con il mantello della giustizia, come uno sposo si mette il diadema e come una sposa si adorna di gioielli."],["Isaia 65,17","Ecco, infatti, io creo nuovi cieli e nuova terra; non si ricorderà più il passato, non verrà più in mente,"],["Isaia 65,18","poiché si godrà e si gioirà sempre di quello che sto per creare, poiché creo Gerusalemme per la gioia, e il suo popolo per il gaudio."],["Isaia 65,24","Prima che mi invochino, io risponderò; mentre ancora stanno parlando, io già li avrò ascoltati."],["Isaia 66,13","Come una madre consola un figlio, così io vi consolerò; a Gerusalemme sarete consolati."],["Lamentazioni 3,22-23","Le grazie del Signore non sono finite, non sono esaurite le sue misericordie. Si rinnovano ogni mattina, grande è la sua fedeltà."],["Luca 1,37","nulla è impossibile a Dio»."],["Luca 10,20","Non rallegratevi però perché i demòni si sottomettono a voi; rallegratevi piuttosto perché i vostri nomi sono scritti nei cieli»."],["Luca 10,27","Costui rispose: « Amerai il Signore tuo Dio con tutto il tuo cuore, con tutta la tua anima, con tutta la tua forza e con tutta la tua mente, e il tuo prossimo come te stesso »."],["Luca 11,14","Gesù stava scacciando un demonio che era muto. Uscito il demonio, il muto cominciò a parlare e le folle furono prese da stupore."],["Luca 11,2-4","Ed egli disse loro: «Quando pregate, dite: Padre, sia santificato il tuo nome, venga il tuo regno; dacci ogni giorno il nostro pane quotidiano, e perdona a noi i nostri peccati, anche noi infatti perdoniamo a ogni nostro debitore, e non abbandonarci alla tentazione»."],["Luca 11,28","Ma egli disse: «Beati piuttosto coloro che ascoltano la parola di Dio e la osservano!»."],["Luca 11,33","Nessuno accende una lampada e poi la mette in un luogo nascosto o sotto il moggio, ma sul candelabro, perché chi entra veda la luce."],["Luca 11,36","Se dunque il tuo corpo è tutto luminoso, senza avere alcuna parte nelle tenebre, sarà tutto nella luce, come quando la lampada ti illumina con il suo fulgore»."],["Luca 12,24","Guardate i corvi: non séminano e non mietono, non hanno dispensa né granaio, eppure Dio li nutre. Quanto più degli uccelli valete voi!"],["Luca 12,27","Guardate come crescono i gigli: non faticano e non filano. Eppure io vi dico: neanche Salomone, con tutta la sua gloria, vestiva come uno di loro."],["Luca 12,33-34","Vendete ciò che possedete e datelo in elemosina; fatevi borse che non invecchiano, un tesoro sicuro nei cieli, dove ladro non arriva e tarlo non consuma. Perché, dov'è il vostro tesoro, là sarà anche il vostro cuore."],["Luca 14,12-14","Disse poi a colui che l'aveva invitato: «Quando offri un pranzo o una cena, non invitare i tuoi amici né i tuoi fratelli né i tuoi parenti né i ricchi vicini, perché a loro volta non ti invitino anch'essi e tu abbia il contraccambio. Al contrario, quando offri un banchetto, invita poveri, storpi, zoppi, ciechi; e sarai beato perché non hanno da ricambiarti. Riceverai infatti la tua ricompensa alla risurrezione dei giusti»."],["Luca 15,10","Così, io vi dico, vi è gioia davanti agli angeli di Dio per un solo peccatore che si converte»."],["Luca 15,7","Io vi dico: così vi sarà gioia nel cielo per un solo peccatore che si converte, più che per novantanove giusti i quali non hanno bisogno di conversione."],["Luca 16,10","Chi è fedele in cose di poco conto, è fedele anche in cose importanti; e chi è disonesto in cose di poco conto, è disonesto anche in cose importanti."],["Luca 16,13","Nessun servitore può servire due padroni, perché o odierà l'uno e amerà l'altro, oppure si affezionerà all'uno e disprezzerà l'altro. Non potete servire Dio e la ricchezza»."],["Luca 17,3-4","State attenti a voi stessi! Se il tuo fratello commetterà una colpa, rimproveralo; ma se si pentirà, perdonagli. E se commetterà una colpa sette volte al giorno contro di te e sette volte ritornerà a te dicendo: «Sono pentito», tu gli perdonerai»."],["Luca 18,1","Diceva loro una parabola sulla necessità di pregare sempre, senza stancarsi mai:"],["Luca 18,17","In verità io vi dico: chi non accoglie il regno di Dio come l'accoglie un bambino, non entrerà in esso»."],["Luca 18,27","Rispose: «Ciò che è impossibile agli uomini, è possibile a Dio»."],["Luca 2,51","Scese dunque con loro e venne a Nàzaret e stava loro sottomesso. Sua madre custodiva tutte queste cose nel suo cuore."],["Luca 21,15","io vi darò parola e sapienza, cosicché tutti i vostri avversari non potranno resistere né controbattere."],["Luca 23,34","Gesù diceva: «Padre, perdona loro perché non sanno quello che fanno». Poi dividendo le sue vesti, le tirarono a sorte."],["Luca 4,18","Lo Spirito del Signore è sopra di me; per questo mi ha consacrato con l'unzione e mi ha mandato a portare ai poveri il lieto annuncio, a proclamare ai prigionieri la liberazione e ai ciechi la vista; a rimettere in libertà gli oppressi,"],["Luca 6,27","Ma a voi che ascoltate, io dico: amate i vostri nemici, fate del bene a quelli che vi odiano,"],["Luca 6,31","E come volete che gli uomini facciano a voi, così anche voi fate a loro."],["Luca 6,35","Amate invece i vostri nemici, fate del bene e prestate senza sperarne nulla, e la vostra ricompensa sarà grande e sarete figli dell'Altissimo, perché egli è benevolo verso gli ingrati e i malvagi."],["Luca 6,36","Siate misericordiosi, come il Padre vostro è misericordioso."],["Luca 6,37","Non giudicate e non sarete giudicati; non condannate e non sarete condannati; perdonate e sarete perdonati."],["Luca 6,38","Date e vi sarà dato: una misura buona, pigiata, colma e traboccante vi sarà versata nel grembo, perché con la misura con la quale misurate, sarà misurato a voi in cambio»."],["Luca 6,46","Perché mi invocate: «Signore, Signore!» e non fate quello che dico?"],["Luca 7,47","Per questo io ti dico: sono perdonati i suoi molti peccati, perché ha molto amato. Invece colui al quale si perdona poco, ama poco»."],["Luca 8,16","Nessuno accende una lampada e la copre con un vaso o la mette sotto un letto, ma la pone su un candelabro, perché chi entra veda la luce."],["Luca 9,1-2","Convocò i Dodici e diede loro forza e potere su tutti i demòni e di guarire le malattie. E li mandò ad annunciare il regno di Dio e a guarire gli infermi."],["Marco 1,35","Al mattino presto si alzò quando ancora era buio e, uscito, si ritirò in un luogo deserto, e là pregava."],["Marco 10,15","In verità io vi dico: chi non accoglie il regno di Dio come lo accoglie un bambino, non entrerà in esso»."],["Marco 10,45","Anche il Figlio dell'uomo infatti non è venuto per farsi servire, ma per servire e dare la propria vita in riscatto per molti»."],["Marco 11,23","In verità io vi dico: se uno dicesse a questo monte: «Lèvati e gèttati nel mare», senza dubitare in cuor suo, ma credendo che quanto dice avviene, ciò gli avverrà."],["Marco 11,24","Per questo vi dico: tutto quello che chiederete nella preghiera, abbiate fede di averlo ottenuto e vi accadrà."],["Marco 11,25","Quando vi mettete a pregare, se avete qualcosa contro qualcuno, perdonate, perché anche il Padre vostro che è nei cieli perdoni a voi le vostre colpe». ["],["Marco 12,30","amerai il Signore tuo Dio con tutto il tuo cuore e con tutta la tua anima, con tutta la tua mente e con tutta la tua forza ."],["Marco 12,31","Il secondo è questo: Amerai il tuo prossimo come te stesso . Non c'è altro comandamento più grande di questi»."],["Marco 16,20","Allora essi partirono e predicarono dappertutto, mentre il Signore agiva insieme con loro e confermava la Parola con i segni che la accompagnavano."],["Marco 2,27","E diceva loro: «Il sabato è stato fatto per l'uomo e non l'uomo per il sabato!"],["Marco 4,21","Diceva loro: «Viene forse la lampada per essere messa sotto il moggio o sotto il letto? O non invece per essere messa sul candelabro?"],["Marco 5,36","Ma Gesù, udito quanto dicevano, disse al capo della sinagoga: «Non temere, soltanto abbi fede!»."],["Marco 6,31","Ed egli disse loro: «Venite in disparte, voi soli, in un luogo deserto, e riposatevi un po'». Erano infatti molti quelli che andavano e venivano e non avevano neanche il tempo di mangiare."],["Marco 6,34","Sceso dalla barca, egli vide una grande folla, ebbe compassione di loro, perché erano come pecore che non hanno pastore , e si mise a insegnare loro molte cose."],["Marco 9,24","Il padre del fanciullo rispose subito ad alta voce: «Credo; aiuta la mia incredulità!»."],["Marco 9,35","Sedutosi, chiamò i Dodici e disse loro: «Se uno vuole essere il primo, sia l'ultimo di tutti e il servitore di tutti»."],["Marco 9,41","Chiunque infatti vi darà da bere un bicchiere d'acqua nel mio nome perché siete di Cristo, in verità io vi dico, non perderà la sua ricompensa."],["Matteo 10,16","Ecco: io vi mando come pecore in mezzo a lupi; siate dunque prudenti come i serpenti e semplici come le colombe."],["Matteo 10,29-31","Due passeri non si vendono forse per un soldo? Eppure nemmeno uno di essi cadrà a terra senza il volere del Padre vostro. Perfino i capelli del vostro capo sono tutti contati. Non abbiate dunque paura: voi valete più di molti passeri!"],["Matteo 10,8","Guarite gli infermi, risuscitate i morti, purificate i lebbrosi, scacciate i demòni. Gratuitamente avete ricevuto, gratuitamente date."],["Matteo 11,28","Venite a me, voi tutti che siete stanchi e oppressi, e io vi darò ristoro."],["Matteo 11,29","Prendete il mio giogo sopra di voi e imparate da me, che sono mite e umile di cuore, e troverete ristoro per la vostra vita ."],["Matteo 14,14","Sceso dalla barca, egli vide una grande folla, sentì compassione per loro e guarì i loro malati."],["Matteo 17,20","Ed egli rispose loro: «Per la vostra poca fede. In verità io vi dico: se avrete fede pari a un granello di senape, direte a questo monte: «Spòstati da qui a là», ed esso si sposterà, e nulla vi sarà impossibile». ["],["Matteo 18,10","Guardate di non disprezzare uno solo di questi piccoli, perché io vi dico che i loro angeli nei cieli vedono sempre la faccia del Padre mio che è nei cieli. ["],["Matteo 18,19","In verità io vi dico ancora: se due di voi sulla terra si metteranno d'accordo per chiedere qualunque cosa, il Padre mio che è nei cieli gliela concederà."],["Matteo 18,20","Perché dove sono due o tre riuniti nel mio nome, lì sono io in mezzo a loro»."],["Matteo 18,21-22","Allora Pietro gli si avvicinò e gli disse: «Signore, se il mio fratello commette colpe contro di me, quante volte dovrò perdonargli? Fino a sette volte?». E Gesù gli rispose: «Non ti dico fino a sette volte, ma fino a settanta volte sette."],["Matteo 18,3","e disse: «In verità io vi dico: se non vi convertirete e non diventerete come i bambini, non entrerete nel regno dei cieli."],["Matteo 18,4","Perciò chiunque si farà piccolo come questo bambino, costui è il più grande nel regno dei cieli."],["Matteo 19,14","Gesù però disse: «Lasciateli, non impedite che i bambini vengano a me; a chi è come loro, infatti, appartiene il regno dei cieli»."],["Matteo 19,19","onora il padre e la madre e amerai il prossimo tuo come te stesso » ."],["Matteo 20,28","Come il Figlio dell'uomo, che non è venuto per farsi servire, ma per servire e dare la propria vita in riscatto per molti»."],["Matteo 21,21","Rispose loro Gesù: «In verità io vi dico: se avrete fede e non dubiterete, non solo potrete fare ciò che ho fatto a quest'albero, ma, anche se direte a questo monte: «Lèvati e gèttati nel mare», ciò avverrà."],["Matteo 21,22","E tutto quello che chiederete con fede nella preghiera, lo otterrete»."],["Matteo 22,32","Io sono il Dio di Abramo, il Dio di Isacco e il Dio di Giacobbe ? Non è il Dio dei morti, ma dei viventi!»."],["Matteo 22,37","Gli rispose: « Amerai il Signore tuo Dio con tutto il tuo cuore, con tutta la tua anima e con tutta la tua mente ."],["Matteo 22,39","Il secondo poi è simile a quello: Amerai il tuo prossimo come te stesso ."],["Matteo 23,11","Chi tra voi è più grande, sarà vostro servo;"],["Matteo 23,12","chi invece si esalterà, sarà umiliato e chi si umilierà sarà esaltato."],["Matteo 24,13","Ma chi avrà perseverato fino alla fine sarà salvato."],["Matteo 24,45-47","Chi è dunque il servo fidato e prudente, che il padrone ha messo a capo dei suoi domestici per dare loro il cibo a tempo debito? Beato quel servo che il padrone, arrivando, troverà ad agire così! Davvero io vi dico: lo metterà a capo di tutti i suoi beni."],["Matteo 25,21","«Bene, servo buono e fedele - gli disse il suo padrone -, sei stato fedele nel poco, ti darò potere su molto; prendi parte alla gioia del tuo padrone»."],["Matteo 25,35","perché ho avuto fame e mi avete dato da mangiare, ho avuto sete e mi avete dato da bere, ero straniero e mi avete accolto,"],["Matteo 26,41","Vegliate e pregate, per non entrare in tentazione. Lo spirito è pronto, ma la carne è debole»."],["Matteo 28,19","Andate dunque e fate discepoli tutti i popoli, battezzandoli nel nome del Padre e del Figlio e dello Spirito Santo,"],["Matteo 28,20","insegnando loro a osservare tutto ciò che vi ho comandato. Ed ecco, io sono con voi tutti i giorni, fino alla fine del mondo»."],["Matteo 4,19","E disse loro: «Venite dietro a me, vi farò pescatori di uomini»."],["Matteo 4,4","Ma egli rispose: «Sta scritto: Non di solo pane vivrà l'uomo, ma di ogni parola che esce dalla bocca di Dio »."],["Matteo 4,8-10","Di nuovo il diavolo lo portò sopra un monte altissimo e gli mostrò tutti i regni del mondo e la loro gloria e gli disse: «Tutte queste cose io ti darò se, gettandoti ai miei piedi, mi adorerai». Allora Gesù gli rispose: «Vattene, Satana! Sta scritto infatti: Il Signore, Dio tuo, adorerai: a lui solo renderai culto »."],["Matteo 5,14-16","Voi siete la luce del mondo; non può restare nascosta una città che sta sopra un monte, né si accende una lampada per metterla sotto il moggio, ma sul candelabro, e così fa luce a tutti quelli che sono nella casa. Così risplenda la vostra luce davanti agli uomini, perché vedano le vostre opere buone e rendano gloria al Padre vostro che è nei cieli."],["Matteo 5,23-24","Se dunque tu presenti la tua offerta all'altare e lì ti ricordi che tuo fratello ha qualche cosa contro di te, lascia lì il tuo dono davanti all'altare, va' prima a riconciliarti con il tuo fratello e poi torna a offrire il tuo dono."],["Matteo 5,4","Beati quelli che sono nel pianto, perché saranno consolati."],["Matteo 5,42","Da' a chi ti chiede, e a chi desidera da te un prestito non voltare le spalle."],["Matteo 5,44","Ma io vi dico: amate i vostri nemici e pregate per quelli che vi perseguitano,"],["Matteo 5,46","Infatti, se amate quelli che vi amano, quale ricompensa ne avete? Non fanno così anche i pubblicani?"],["Matteo 5,7","Beati i misericordiosi, perché troveranno misericordia."],["Matteo 5,8","Beati i puri di cuore, perché vedranno Dio."],["Matteo 5,9","Beati gli operatori di pace, perché saranno chiamati figli di Dio."],["Matteo 6,1","State attenti a non praticare la vostra giustizia davanti agli uomini per essere ammirati da loro, altrimenti non c'è ricompensa per voi presso il Padre vostro che è nei cieli."],["Matteo 6,12","e rimetti a noi i nostri debiti come anche noi li rimettiamo ai nostri debitori,"],["Matteo 6,14-15","Se voi infatti perdonerete agli altri le loro colpe, il Padre vostro che è nei cieli perdonerà anche a voi; ma se voi non perdonerete agli altri, neppure il Padre vostro perdonerà le vostre colpe."],["Matteo 6,19-21","Non accumulate per voi tesori sulla terra, dove tarma e ruggine consumano e dove ladri scassìnano e rubano; accumulate invece per voi tesori in cielo, dove né tarma né ruggine consumano e dove ladri non scassìnano e non rubano. Perché, dov'è il tuo tesoro, là sarà anche il tuo cuore."],["Matteo 6,24","Nessuno può servire due padroni, perché o odierà l'uno e amerà l'altro, oppure si affezionerà all'uno e disprezzerà l'altro. Non potete servire Dio e la ricchezza."],["Matteo 6,25","Perciò io vi dico: non preoccupatevi per la vostra vita, di quello che mangerete o berrete, né per il vostro corpo, di quello che indosserete; la vita non vale forse più del cibo e il corpo più del vestito?"],["Matteo 6,27","E chi di voi, per quanto si preoccupi, può allungare anche di poco la propria vita?"],["Matteo 6,31-32","Non preoccupatevi dunque dicendo: «Che cosa mangeremo? Che cosa berremo? Che cosa indosseremo?». Di tutte queste cose vanno in cerca i pagani. Il Padre vostro celeste, infatti, sa che ne avete bisogno."],["Matteo 6,33","Cercate invece, anzitutto, il regno di Dio e la sua giustizia, e tutte queste cose vi saranno date in aggiunta."],["Matteo 6,34","Non preoccupatevi dunque del domani, perché il domani si preoccuperà di se stesso. A ciascun giorno basta la sua pena."],["Matteo 6,6","Invece, quando tu preghi, entra nella tua camera, chiudi la porta e prega il Padre tuo, che è nel segreto; e il Padre tuo, che vede nel segreto, ti ricompenserà."],["Matteo 6,7","Pregando, non sprecate parole come i pagani: essi credono di venire ascoltati a forza di parole."],["Matteo 6,9","Voi dunque pregate così: Padre nostro che sei nei cieli, sia santificato il tuo nome,"],["Matteo 7,11","Se voi, dunque, che siete cattivi, sapete dare cose buone ai vostri figli, quanto più il Padre vostro che è nei cieli darà cose buone a quelli che gliele chiedono!"],["Matteo 7,12","Tutto quanto volete che gli uomini facciano a voi, anche voi fatelo a loro: questa infatti è la Legge e i Profeti."],["Matteo 7,7","Chiedete e vi sarà dato, cercate e troverete, bussate e vi sarà aperto."],["Matteo 8,17","perché si compisse ciò che era stato detto per mezzo del profeta Isaia: Egli ha preso le nostre infermità e si è caricato delle malattie ."],["Matteo 9,13","Andate a imparare che cosa vuol dire: Misericordia io voglio e non sacrifici . Io non sono venuto infatti a chiamare i giusti, ma i peccatori»."],["Matteo 9,36","Vedendo le folle, ne sentì compassione, perché erano stanche e sfinite come pecore che non hanno pastore ."],["Michea 6,8","Uomo, ti è stato insegnato ciò che è buono e ciò che richiede il Signore da te: praticare la giustizia, amare la bontà, camminare umilmente con il tuo Dio."],["Michea 7,18","Quale dio è come te, che toglie l'iniquità e perdona il peccato al resto della sua eredità? Egli non serba per sempre la sua ira, ma si compiace di manifestare il suo amore."],["Neemia 8,10","Poi Neemia disse loro: «Andate, mangiate carni grasse e bevete vini dolci e mandate porzioni a quelli che nulla hanno di preparato, perché questo giorno è consacrato al Signore nostro; non vi rattristate, perché la gioia del Signore è la vostra forza»."],["Proverbi 1,33","ma chi ascolta me vivrà in pace e sarà sicuro senza temere alcun male»."],["Proverbi 1,5","Il saggio ascolti e accrescerà il sapere, e chi è avveduto acquisterà destrezza,"],["Proverbi 1,7","Il timore del Signore è principio della scienza; gli stolti disprezzano la sapienza e l'istruzione."],["Proverbi 1,8","Ascolta, figlio mio, l'istruzione di tuo padre e non disprezzare l'insegnamento di tua madre,"],["Proverbi 10,1","Proverbi di Salomone. Il figlio saggio allieta il padre, il figlio stolto contrista sua madre."],["Proverbi 10,12","L'odio suscita litigi, l'amore ricopre ogni colpa."],["Proverbi 10,23","Per lo stolto compiere il male è un divertimento, così coltivare la sapienza per l'uomo prudente."],["Proverbi 10,4","La mano pigra rende poveri, la mano operosa arricchisce."],["Proverbi 10,9","Chi cammina nell'integrità va sicuro, chi tiene vie tortuose sarà smascherato."],["Proverbi 11,1","Il Signore aborrisce la bilancia falsa, ma del peso esatto egli si compiace."],["Proverbi 11,13","Chi va in giro sparlando svela il segreto, ma l'uomo fidato tiene nascosto ciò che sa."],["Proverbi 11,17","Benefica se stesso chi è buono, il crudele invece tormenta la sua carne."],["Proverbi 11,2","Dove c'è insolenza c'è anche disonore, ma la sapienza sta con gli umili."],["Proverbi 11,25","La persona benefica prospererà e chi disseta sarà dissetato."],["Proverbi 11,27","Chi è sollecito del bene incontra favore e chi cerca il male, male gli accadrà."],["Proverbi 12,15","La via del malvagio è retta ai propri occhi, il saggio, invece, ascolta il consiglio."],["Proverbi 12,18","C'è chi chiacchierando è come una spada tagliente, ma la lingua dei saggi risana."],["Proverbi 12,22","Le labbra bugiarde sono un obbrobrio per il Signore: egli si compiace di chiunque fa la verità."],["Proverbi 12,24","La mano operosa ottiene il comando, quella pigra invece è destinata a servire."],["Proverbi 12,25","L'afflizione deprime il cuore dell'uomo, una parola buona lo allieta."],["Proverbi 12,26","Il giusto è guida sicura per il suo prossimo, ma la via dei malvagi li porta fuori strada."],["Proverbi 12,28","Sui sentieri della giustizia si trova la vita, la sua strada non va mai alla morte."],["Proverbi 13,10","L'insolenza provoca litigi, ma la sapienza sta con chi accetta consigli."],["Proverbi 13,20","Va' con i saggi e saggio diventerai, chi pratica gli stolti ne subirà danno."],["Proverbi 13,4","Il pigro brama, ma non c'è nulla per il suo appetito, mentre l'appetito dei laboriosi sarà soddisfatto."],["Proverbi 14,26","Nel timore del Signore sta la fiducia del forte; anche per i suoi figli egli sarà un rifugio."],["Proverbi 14,29","Chi è paziente ha grande prudenza, chi è iracondo mostra stoltezza."],["Proverbi 14,31","Chi opprime il povero offende il suo creatore, chi ha pietà del misero lo onora."],["Proverbi 15,1","Una risposta gentile calma la collera, una parola pungente eccita l'ira."],["Proverbi 15,18","Chi è collerico suscita contese, chi è paziente calma le liti."],["Proverbi 15,22","Falliscono le decisioni prese senza consultazione, riescono quelle suggerite da molti consiglieri."],["Proverbi 15,23","È una gioia saper dare una risposta; una parola detta al momento giusto è gradita!"],["Proverbi 15,5","Lo stolto disprezza la correzione di suo padre, chi tiene conto del rimprovero diventa prudente."],["Proverbi 16,13","Il re si compiace di chi dice la verità, egli ama chi parla con rettitudine."],["Proverbi 16,24","Favo di miele sono le parole gentili, dolce per il palato e medicina per le ossa."],["Proverbi 16,28","L'uomo perverso provoca litigi, chi calunnia divide gli amici."],["Proverbi 16,4","Il Signore ha fatto ogni cosa per il suo fine e anche il malvagio per il giorno della sventura."],["Proverbi 16,9","Il cuore dell'uomo elabora progetti, ma è il Signore che rende saldi i suoi passi."],["Proverbi 17,17","Un amico vuol bene sempre, è nato per essere un fratello nella sventura."],["Proverbi 17,22","Un cuore lieto fa bene al corpo, uno spirito depresso inaridisce le ossa."],["Proverbi 17,6","Corona dei vecchi sono i figli dei figli, onore dei figli i loro padri."],["Proverbi 17,9","Chi copre la colpa cerca l'amicizia, ma chi la divulga divide gli amici."],["Proverbi 18,10","Torre fortificata è il nome del Signore: il giusto vi si rifugia ed è al sicuro."],["Proverbi 19,1","Meglio un povero dalla condotta integra di uno dalle labbra perverse e che è stolto."],["Proverbi 19,11","È segno d'intelligenza per l'uomo trattenere la collera, ed è sua gloria passare sopra alle offese."],["Proverbi 19,17","Chi ha pietà del povero fa un prestito al Signore, che gli darà la sua ricompensa."],["Proverbi 19,20","Ascolta il consiglio e accetta la correzione, per essere saggio fino al termine della tua vita."],["Proverbi 19,21","Molti sono i progetti nel cuore dell'uomo, ma solo i disegni del Signore si compiono."],["Proverbi 2,6","perché il Signore dà la sapienza, dalla sua bocca escono scienza e prudenza."],["Proverbi 2,7","Egli riserva ai giusti il successo, è scudo a coloro che agiscono con rettitudine,"],["Proverbi 20,6","Molti proclamano la propria bontà, ma una persona fidata chi la trova?"],["Proverbi 20,7","Chi cammina nella sua integrità è giusto; beati i figli che lascia dietro di sé!"],["Proverbi 21,21","Chi ricerca la giustizia e l'amore troverà vita e gloria."],["Proverbi 21,3","Praticare la giustizia e l'equità per il Signore vale più di un sacrificio."],["Proverbi 21,5","I progetti di chi è diligente si risolvono in profitto, ma chi ha troppa fretta va verso l'indigenza."],["Proverbi 22,29","Hai visto un uomo sollecito nel lavoro? Egli starà al servizio del re e non al servizio di gente oscura!"],["Proverbi 22,4","Frutti dell'umiltà sono il timore di Dio, la ricchezza, l'onore e la vita."],["Proverbi 22,6","Indirizza il giovane sulla via da seguire; neppure da vecchio se ne allontanerà."],["Proverbi 22,9","Chi è generoso sarà benedetto, perché egli dona del suo pane al povero."],["Proverbi 24,16","perché se il giusto cade sette volte, egli si rialza, ma i malvagi soccombono nella sventura."],["Proverbi 25,11","Come mele d'oro su vassoio d'argento cesellato, è una parola detta a suo tempo."],["Proverbi 27,17","Il ferro si aguzza con il ferro e l'uomo aguzza l'ingegno del suo compagno."],["Proverbi 27,23","Preòccupati dello stato del tuo gregge, abbi cura delle tue mandrie,"],["Proverbi 27,9","Profumo e incenso allietano il cuore e il consiglio dell'amico addolcisce l'animo."],["Proverbi 28,1","Il malvagio fugge anche se nessuno lo insegue, mentre il giusto è sicuro come un giovane leone."],["Proverbi 28,20","L'uomo leale sarà colmo di benedizioni, chi ha fretta di arricchirsi non sarà esente da colpa."],["Proverbi 28,26","Chi confida nel suo senno è uno stolto, chi cammina nella saggezza sarà salvato."],["Proverbi 28,6","Meglio un povero dalla condotta integra che uno dai costumi perversi, anche se ricco."],["Proverbi 29,11","Lo stolto dà sfogo a tutto il suo malanimo, il saggio alla fine lo sa calmare."],["Proverbi 29,25","Chi teme gli uomini si mette in una trappola, ma chi confida nel Signore è al sicuro."],["Proverbi 3,13","Beato l'uomo che ha trovato la sapienza, l'uomo che ottiene il discernimento:"],["Proverbi 3,24","Quando ti coricherai, non avrai paura; ti coricherai e il tuo sonno sarà dolce."],["Proverbi 3,26","perché il Signore sarà la tua sicurezza e preserverà il tuo piede dal laccio."],["Proverbi 3,27","Non negare un bene a chi ne ha il diritto, se hai la possibilità di farlo."],["Proverbi 3,3","Bontà e fedeltà non ti abbandonino: légale attorno al tuo collo, scrivile sulla tavola del tuo cuore,"],["Proverbi 3,5-6","Confida nel Signore con tutto il tuo cuore e non affidarti alla tua intelligenza; riconoscilo in tutti i tuoi passi ed egli appianerà i tuoi sentieri."],["Proverbi 31,10","Una donna forte chi potrà trovarla? Ben superiore alle perle è il suo valore."],["Proverbi 31,26","Apre la bocca con saggezza e la sua lingua ha solo insegnamenti di bontà."],["Proverbi 31,8-9","Apri la bocca in favore del muto, in difesa di tutti gli sventurati. Apri la bocca e giudica con equità, rendi giustizia all'infelice e al povero."],["Proverbi 4,13","Attieniti alla disciplina, non lasciarla, custodiscila, perché essa è la tua vita."],["Proverbi 4,20-22","Figlio mio, fa' attenzione alle mie parole, porgi l'orecchio ai miei detti; non perderli di vista, custodiscili dentro il tuo cuore, perché essi sono vita per chi li trova e guarigione per tutto il suo corpo."],["Proverbi 4,25-27","I tuoi occhi guardino sempre in avanti e le tue pupille mirino diritto davanti a te. Bada alla strada dove metti il piede e tutte le tue vie siano sicure. Non deviare né a destra né a sinistra, tieni lontano dal male il tuo piede."],["Proverbi 4,7","Principio della sapienza: acquista la sapienza; a costo di tutto ciò che possiedi, acquista l'intelligenza."],["Proverbi 5,18-19","Sia benedetta la tua sorgente, e tu trova gioia nella donna della tua giovinezza: cerva amabile, gazzella graziosa, i suoi seni ti inebrino sempre, sii sempre invaghito del suo amore!"],["Proverbi 6,23","perché il comando è una lampada e l'insegnamento una luce e un sentiero di vita l'istruzione che ti ammonisce:"],["Proverbi 8,11-12","perché la sapienza vale più delle perle e quanto si può desiderare non l'eguaglia. Io, la sapienza, abito con la prudenza e possiedo scienza e riflessione."],["Proverbi 8,17","Io amo coloro che mi amano, e quelli che mi cercano mi trovano."],["Qoèlet 3,1","Tutto ha il suo momento, e ogni evento ha il suo tempo sotto il cielo."],["Qoèlet 3,11","Egli ha fatto bella ogni cosa a suo tempo; inoltre ha posto nel loro cuore la durata dei tempi, senza però che gli uomini possano trovare la ragione di ciò che Dio compie dal principio alla fine."],["Qoèlet 3,14","Riconosco che qualsiasi cosa Dio fa, dura per sempre; non c'è nulla da aggiungere, nulla da togliere. Dio agisce così perché lo si tema."],["Qoèlet 7,12","Perché si sta all'ombra della saggezza come si sta all'ombra del denaro; ma vale di più il sapere, perché la saggezza fa vivere chi la possiede."],["Qoèlet 7,8","Meglio la fine di una cosa che il suo principio; è meglio un uomo paziente che uno presuntuoso."],["Qoèlet 9,10","Tutto ciò che la tua mano è in grado di fare, fallo con tutta la tua forza, perché non ci sarà né attività né calcolo né scienza né sapienza nel regno dei morti, dove stai per andare."],["Romani 10,10","Con il cuore infatti si crede per ottenere la giustizia, e con la bocca si fa la professione di fede per avere la salvezza."],["Romani 10,13","Infatti: Chiunque invocherà il nome del Signore sarà salvato ."],["Romani 10,17","Dunque, la fede viene dall'ascolto e l'ascolto riguarda la parola di Cristo."],["Romani 10,4","Ora, il termine della Legge è Cristo, perché la giustizia sia data a chiunque crede."],["Romani 10,9","Perché se con la tua bocca proclamerai: «Gesù è il Signore!», e con il tuo cuore crederai che Dio lo ha risuscitato dai morti, sarai salvo."],["Romani 11,29","infatti i doni e la chiamata di Dio sono irrevocabili!"],["Romani 11,36","Poiché da lui, per mezzo di lui e per lui sono tutte le cose. A lui la gloria nei secoli. Amen."],["Romani 11,6","E se lo è per grazia, non lo è per le opere; altrimenti la grazia non sarebbe più grazia."],["Romani 12,1","Vi esorto dunque, fratelli, per la misericordia di Dio, a offrire i vostri corpi come sacrificio vivente, santo e gradito a Dio; è questo il vostro culto spirituale."],["Romani 12,10","amatevi gli uni gli altri con affetto fraterno, gareggiate nello stimarvi a vicenda."],["Romani 12,11","Non siate pigri nel fare il bene, siate invece ferventi nello spirito; servite il Signore."],["Romani 12,12","Siate lieti nella speranza, costanti nella tribolazione, perseveranti nella preghiera."],["Romani 12,13","Condividete le necessità dei santi; siate premurosi nell'ospitalità."],["Romani 12,14","Benedite coloro che vi perseguitano, benedite e non maledite."],["Romani 12,15","Rallegratevi con quelli che sono nella gioia; piangete con quelli che sono nel pianto."],["Romani 12,16","Abbiate i medesimi sentimenti gli uni verso gli altri; non nutrite desideri di grandezza; volgetevi piuttosto a ciò che è umile. Non stimatevi sapienti da voi stessi."],["Romani 12,18","Se possibile, per quanto dipende da voi, vivete in pace con tutti."],["Romani 12,2","Non conformatevi a questo mondo, ma lasciatevi trasformare rinnovando il vostro modo di pensare, per poter discernere la volontà di Dio, ciò che è buono, a lui gradito e perfetto."],["Romani 12,21","Non lasciarti vincere dal male, ma vinci il male con il bene."],["Romani 12,4-5","Poiché, come in un solo corpo abbiamo molte membra e queste membra non hanno tutte la medesima funzione, così anche noi, pur essendo molti, siamo un solo corpo in Cristo e, ciascuno per la sua parte, siamo membra gli uni degli altri."],["Romani 12,6","Abbiamo doni diversi secondo la grazia data a ciascuno di noi: chi ha il dono della profezia la eserciti secondo ciò che detta la fede;"],["Romani 12,9","La carità non sia ipocrita: detestate il male, attaccatevi al bene;"],["Romani 13,10","La carità non fa alcun male al prossimo: pienezza della Legge infatti è la carità."],["Romani 13,8","Non siate debitori di nulla a nessuno, se non dell'amore vicendevole; perché chi ama l'altro ha adempiuto la Legge."],["Romani 14,1","Accogliete chi è debole nella fede, senza discuterne le opinioni."],["Romani 14,17","Il regno di Dio infatti non è cibo o bevanda, ma giustizia, pace e gioia nello Spirito Santo:"],["Romani 14,19","Cerchiamo dunque ciò che porta alla pace e alla edificazione vicendevole."],["Romani 14,23","Ma chi è nel dubbio, mangiando si condanna, perché non agisce secondo coscienza; tutto ciò, infatti, che non viene dalla coscienza è peccato."],["Romani 15,1-2","Noi, che siamo i forti, abbiamo il dovere di portare le infermità dei deboli, senza compiacere noi stessi. Ciascuno di noi cerchi di piacere al prossimo nel bene, per edificarlo."],["Romani 15,13","Il Dio della speranza vi riempia, nel credere, di ogni gioia e pace, perché abbondiate nella speranza per la virtù dello Spirito Santo."],["Romani 15,4","Tutto ciò che è stato scritto prima di noi, è stato scritto per nostra istruzione, perché, in virtù della perseveranza e della consolazione che provengono dalle Scritture, teniamo viva la speranza."],["Romani 16,1-3","Vi raccomando Febe, nostra sorella, che è al servizio della Chiesa di Cencre: accoglietela nel Signore, come si addice ai santi, e assistetela in qualunque cosa possa avere bisogno di voi; anch'essa infatti ha protetto molti, e anche me stesso. Salutate Prisca e Aquila, miei collaboratori in Cristo Gesù."],["Romani 16,19","La fama della vostra obbedienza è giunta a tutti: mentre dunque mi rallegro di voi, voglio che siate saggi nel bene e immuni dal male."],["Romani 16,20","Il Dio della pace schiaccerà ben presto Satana sotto i vostri piedi. La grazia del Signore nostro Gesù sia con voi."],["Romani 2,4","O disprezzi la ricchezza della sua bontà, della sua clemenza e della sua magnanimità, senza riconoscere che la bontà di Dio ti spinge alla conversione?"],["Romani 3,24","ma sono giustificati gratuitamente per la sua grazia, per mezzo della redenzione che è in Cristo Gesù."],["Romani 4,22","Ecco perché gli fu accreditato come giustizia."],["Romani 5,1","Giustificati dunque per fede, noi siamo in pace con Dio per mezzo del Signore nostro Gesù Cristo."],["Romani 5,3-4","E non solo: ci vantiamo anche nelle tribolazioni, sapendo che la tribolazione produce pazienza, la pazienza una virtù provata e la virtù provata la speranza."],["Romani 5,5","La speranza poi non delude, perché l'amore di Dio è stato riversato nei nostri cuori per mezzo dello Spirito Santo che ci è stato dato."],["Romani 5,8","Ma Dio dimostra il suo amore verso di noi nel fatto che, mentre eravamo ancora peccatori, Cristo è morto per noi."],["Romani 6,14","Il peccato infatti non dominerà su di voi, perché non siete sotto la Legge, ma sotto la grazia."],["Romani 6,22","Ora invece, liberati dal peccato e fatti servi di Dio, raccogliete il frutto per la vostra santificazione e come traguardo avete la vita eterna."],["Romani 8,1","Ora, dunque, non c'è nessuna condanna per quelli che sono in Cristo Gesù."],["Romani 8,11","E se lo Spirito di Dio, che ha risuscitato Gesù dai morti, abita in voi, colui che ha risuscitato Cristo dai morti darà la vita anche ai vostri corpi mortali per mezzo del suo Spirito che abita in voi."],["Romani 8,15","E voi non avete ricevuto uno spirito da schiavi per ricadere nella paura, ma avete ricevuto lo Spirito che rende figli adottivi, per mezzo del quale gridiamo: «Abbà! Padre!»."],["Romani 8,18","Ritengo infatti che le sofferenze del tempo presente non siano paragonabili alla gloria futura che sarà rivelata in noi."],["Romani 8,25","Ma, se speriamo quello che non vediamo, lo attendiamo con perseveranza."],["Romani 8,26","Allo stesso modo anche lo Spirito viene in aiuto alla nostra debolezza; non sappiamo infatti come pregare in modo conveniente, ma lo Spirito stesso intercede con gemiti inesprimibili;"],["Romani 8,28","Del resto, noi sappiamo che tutto concorre al bene, per quelli che amano Dio, per coloro che sono stati chiamati secondo il suo disegno."],["Romani 8,30","quelli poi che ha predestinato, li ha anche chiamati; quelli che ha chiamato, li ha anche giustificati; quelli che ha giustificato, li ha anche glorificati."],["Romani 8,31","Che diremo dunque di queste cose? Se Dio è per noi, chi sarà contro di noi?"],["Romani 8,37","Ma in tutte queste cose noi siamo più che vincitori grazie a colui che ci ha amati."],["Romani 8,38-39","Io sono infatti persuaso che né morte né vita, né angeli né principati, né presente né avvenire, né potenze, né altezza né profondità, né alcun'altra creatura potrà mai separarci dall'amore di Dio, che è in Cristo Gesù, nostro Signore."],["Rut 1,16-17","Ma Rut replicò: «Non insistere con me che ti abbandoni e torni indietro senza di te, perché dove andrai tu, andrò anch'io, e dove ti fermerai, mi fermerò; il tuo popolo sarà il mio popolo e il tuo Dio sarà il mio Dio. Dove morirai tu, morirò anch'io e lì sarò sepolta. Il Signore mi faccia questo male e altro ancora, se altra cosa, che non sia la morte, mi separerà da te»."],["Rut 4,15","Egli sarà il tuo consolatore e il sostegno della tua vecchiaia, perché lo ha partorito tua nuora, che ti ama e che vale per te più di sette figli»."],["Salmo 1,1","Beato l'uomo che non entra nel consiglio dei malvagi, non resta nella via dei peccatori e non siede in compagnia degli arroganti,"],["Salmo 1,2","ma nella legge del Signore trova la sua gioia, la sua legge medita giorno e notte."],["Salmo 100,3","Riconoscete che solo il Signore è Dio: egli ci ha fatti e noi siamo suoi, suo popolo e gregge del suo pascolo."],["Salmo 100,5","perché buono è il Signore, il suo amore è per sempre, la sua fedeltà di generazione in generazione."],["Salmo 102,28","Ma tu sei sempre lo stesso e i tuoi anni non hanno fine."],["Salmo 103,13","Come è tenero un padre verso i figli, così il Signore è tenero verso quelli che lo temono,"],["Salmo 103,2","Benedici il Signore, anima mia, non dimenticare tutti i suoi benefici."],["Salmo 103,3","Egli perdona tutte le tue colpe, guarisce tutte le tue infermità,"],["Salmo 103,8","Misericordioso e pietoso è il Signore, lento all'ira e grande nell'amore."],["Salmo 106,1-2","Alleluia. Rendete grazie al Signore, perché è buono, perché il suo amore è per sempre. Chi può narrare le prodezze del Signore, far risuonare tutta la sua lode?"],["Salmo 106,3","Beati coloro che osservano il diritto e agiscono con giustizia in ogni tempo."],["Salmo 107,1","Rendete grazie al Signore perché è buono, perché il suo amore è per sempre."],["Salmo 107,20","Mandò la sua parola, li fece guarire e li salvò dalla fossa."],["Salmo 107,28","Nell'angustia gridarono al Signore, ed egli li fece uscire dalle loro angosce."],["Salmo 107,6","Nell'angustia gridarono al Signore ed egli li liberò dalle loro angosce."],["Salmo 109,30","A piena voce ringrazierò il Signore, in mezzo alla folla canterò la sua lode,"],["Salmo 111,10","Principio della sapienza è il timore del Signore: rende saggio chi ne esegue i precetti. La lode del Signore rimane per sempre."],["Salmo 111,9","Mandò a liberare il suo popolo, stabilì la sua alleanza per sempre. Santo e terribile è il suo nome."],["Salmo 112,7","Cattive notizie non avrà da temere, saldo è il suo cuore, confida nel Signore."],["Salmo 113,9","Fa abitare nella casa la sterile, come madre gioiosa di figli. Alleluia."],["Salmo 117,1-2","Genti tutte, lodate il Signore, popoli tutti, cantate la sua lode, perché forte è il suo amore per noi e la fedeltà del Signore dura per sempre. Alleluia."],["Salmo 118,24","Questo è il giorno che ha fatto il Signore: rallegriamoci in esso ed esultiamo!"],["Salmo 118,26","Benedetto colui che viene nel nome del Signore. Vi benediciamo dalla casa del Signore."],["Salmo 118,5","Nel pericolo ho gridato al Signore: mi ha risposto, il Signore, e mi ha tratto in salvo."],["Salmo 118,6","Il Signore è per me, non avrò timore: che cosa potrà farmi un uomo?"],["Salmo 118,8","È meglio rifugiarsi nel Signore che confidare nell'uomo."],["Salmo 119,105","Lampada per i miei passi è la tua parola, luce sul mio cammino."],["Salmo 119,11","Ripongo nel cuore la tua promessa per non peccare contro di te."],["Salmo 119,114","Tu sei mio rifugio e mio scudo: spero nella tua parola."],["Salmo 119,130","La rivelazione delle tue parole illumina, dona intelligenza ai semplici."],["Salmo 119,165","Grande pace per chi ama la tua legge: nel suo cammino non trova inciampo."],["Salmo 119,24","I tuoi insegnamenti sono la mia delizia: sono essi i miei consiglieri."],["Salmo 119,45","Camminerò in un luogo spazioso, perché ho ricercato i tuoi precetti."],["Salmo 119,50","Questo mi consola nella mia miseria: la tua promessa mi fa vivere."],["Salmo 119,76","Il tuo amore sia la mia consolazione, secondo la promessa fatta al tuo servo."],["Salmo 119,92-93","Se la tua legge non fosse la mia delizia, davvero morirei nella mia miseria. Mai dimenticherò i tuoi precetti, perché con essi tu mi fai vivere."],["Salmo 121,7-8","Il Signore ti custodirà da ogni male: egli custodirà la tua vita. Il Signore ti custodirà quando esci e quando entri, da ora e per sempre."],["Salmo 125,2-3","I monti circondano Gerusalemme: il Signore circonda il suo popolo, da ora e per sempre. Non resterà lo scettro dei malvagi sull'eredità dei giusti, perché i giusti non tendano le mani a compiere il male."],["Salmo 127,2","Invano vi alzate di buon mattino e tardi andate a riposare, voi che mangiate un pane di fatica: al suo prediletto egli lo darà nel sonno."],["Salmo 127,3","Ecco, eredità del Signore sono i figli, è sua ricompensa il frutto del grembo."],["Salmo 13,6","Ma io nella tua fedeltà ho confidato; esulterà il mio cuore nella tua salvezza, canterò al Signore, che mi ha beneficato."],["Salmo 130,7","Israele attenda il Signore, perché con il Signore è la misericordia e grande è con lui la redenzione."],["Salmo 133,1-2","Canto delle salite. Di Davide. Ecco, com'è bello e com'è dolce che i fratelli vivano insieme! È come olio prezioso versato sul capo, che scende sulla barba, la barba di Aronne, che scende sull'orlo della sua veste."],["Salmo 136,1","Rendete grazie al Signore perché è buono, perché il suo amore è per sempre."],["Salmo 136,26","Rendete grazie al Dio del cielo, perché il suo amore è per sempre."],["Salmo 136,7","Ha fatto le grandi luci, perché il suo amore è per sempre."],["Salmo 138,3","Nel giorno in cui ti ho invocato, mi hai risposto, hai accresciuto in me la forza."],["Salmo 138,7","Se cammino in mezzo al pericolo, tu mi ridoni vita; contro la collera dei miei avversari stendi la tua mano e la tua destra mi salva."],["Salmo 138,8","Il Signore farà tutto per me. Signore, il tuo amore è per sempre: non abbandonare l'opera delle tue mani."],["Salmo 139,14","Io ti rendo grazie: hai fatto di me una meraviglia stupenda; meravigliose sono le tue opere, le riconosce pienamente l'anima mia."],["Salmo 145,18","Il Signore è vicino a chiunque lo invoca, a quanti lo invocano con sincerità."],["Salmo 145,8","Misericordioso e pietoso è il Signore, lento all'ira e grande nell'amore."],["Salmo 146,5","Beato chi ha per aiuto il Dio di Giacobbe: la sua speranza è nel Signore suo Dio,"],["Salmo 147,3","risana i cuori affranti e fascia le loro ferite."],["Salmo 149,4","Il Signore ama il suo popolo, incorona i poveri di vittoria."],["Salmo 150,6","Ogni vivente dia lode al Signore. Alleluia."],["Salmo 16,11","Mi indicherai il sentiero della vita, gioia piena alla tua presenza, dolcezza senza fine alla tua destra."],["Salmo 17,6","Io t'invoco poiché tu mi rispondi, o Dio; tendi a me l'orecchio, ascolta le mie parole,"],["Salmo 18,20","mi portò al largo, mi liberò perché mi vuol bene."],["Salmo 18,31","La via di Dio è perfetta, la parola del Signore è purificata nel fuoco; egli è scudo per chi in lui si rifugia."],["Salmo 18,33-35","Il Dio che mi ha cinto di vigore e ha reso integro il mio cammino, mi ha dato agilità come di cerve e sulle alture mi ha fatto stare saldo, ha addestrato le mie mani alla battaglia, le mie braccia a tendere l'arco di bronzo."],["Salmo 18,36","Tu mi hai dato il tuo scudo di salvezza, la tua destra mi ha sostenuto, mi hai esaudito e mi hai fatto crescere."],["Salmo 19,15","Ti siano gradite le parole della mia bocca; davanti a te i pensieri del mio cuore, Signore, mia roccia e mio redentore."],["Salmo 19,2","I cieli narrano la gloria di Dio, l'opera delle sue mani annuncia il firmamento."],["Salmo 19,8","La legge del Signore è perfetta, rinfranca l'anima; la testimonianza del Signore è stabile, rende saggio il semplice."],["Salmo 20,5","Ti conceda ciò che il tuo cuore desidera, adempia ogni tuo progetto."],["Salmo 20,8","Chi fa affidamento sui carri, chi sui cavalli: noi invochiamo il nome del Signore, nostro Dio."],["Salmo 21,7","poiché gli accordi benedizioni per sempre, lo inondi di gioia dinanzi al tuo volto."],["Salmo 23,1","Salmo. Di Davide. Il Signore è il mio pastore: non manco di nulla."],["Salmo 23,2","Su pascoli erbosi mi fa riposare, ad acque tranquille mi conduce."],["Salmo 23,3","Rinfranca l'anima mia, mi guida per il giusto cammino a motivo del suo nome."],["Salmo 23,4","Anche se vado per una valle oscura, non temo alcun male, perché tu sei con me. Il tuo bastone e il tuo vincastro mi danno sicurezza."],["Salmo 23,6","Sì, bontà e fedeltà mi saranno compagne tutti i giorni della mia vita, abiterò ancora nella casa del Signore per lunghi giorni."],["Salmo 24,1","Di Davide. Salmo . Del Signore è la terra e quanto contiene: il mondo, con i suoi abitanti."],["Salmo 25,21","Mi proteggano integrità e rettitudine, perché in te ho sperato."],["Salmo 25,4-5","Fammi conoscere, Signore, le tue vie, insegnami i tuoi sentieri. Guidami nella tua fedeltà e istruiscimi, perché sei tu il Dio della mia salvezza; io spero in te tutto il giorno."],["Salmo 25,9","guida i poveri secondo giustizia, insegna ai poveri la sua via."],["Salmo 27,1","Di Davide. Il Signore è mia luce e mia salvezza: di chi avrò timore? Il Signore è difesa della mia vita: di chi avrò paura?"],["Salmo 27,10","Mio padre e mia madre mi hanno abbandonato, ma il Signore mi ha raccolto."],["Salmo 27,13","Sono certo di contemplare la bontà del Signore nella terra dei viventi."],["Salmo 27,14","Spera nel Signore, sii forte, si rinsaldi il tuo cuore e spera nel Signore."],["Salmo 27,3","Se contro di me si accampa un esercito, il mio cuore non teme; se contro di me si scatena una guerra, anche allora ho fiducia."],["Salmo 27,5","Nella sua dimora mi offre riparo nel giorno della sventura. Mi nasconde nel segreto della sua tenda, sopra una roccia mi innalza."],["Salmo 27,8","Il mio cuore ripete il tuo invito: »Cercate il mio volto!». Il tuo volto, Signore, io cerco."],["Salmo 28,7","Il Signore è mia forza e mio scudo, in lui ha confidato il mio cuore. Mi ha dato aiuto: esulta il mio cuore, con il mio canto voglio rendergli grazie."],["Salmo 29,11","Il Signore darà potenza al suo popolo, il Signore benedirà il suo popolo con la pace."],["Salmo 30,3","Signore, mio Dio, a te ho gridato e mi hai guarito."],["Salmo 30,6","perché la sua collera dura un istante, la sua bontà per tutta la vita. Alla sera ospite è il pianto e al mattino la gioia."],["Salmo 31,15-16","Ma io confido in te, Signore; dico: «Tu sei il mio Dio, i miei giorni sono nelle tue mani». Liberami dalla mano dei miei nemici e dai miei persecutori:"],["Salmo 31,20","Quanto è grande la tua bontà, Signore! La riservi per coloro che ti temono, la dispensi, davanti ai figli dell'uomo, a chi in te si rifugia."],["Salmo 31,24","Amate il Signore, voi tutti suoi fedeli; il Signore protegge chi ha fiducia in lui e ripaga in abbondanza chi opera con superbia."],["Salmo 31,25","Siate forti, rendete saldo il vostro cuore, voi tutti che sperate nel Signore."],["Salmo 32,1","Di Davide. Maskil. Beato l'uomo a cui è tolta la colpa e coperto il peccato."],["Salmo 32,10","Molti saranno i dolori del malvagio, ma l'amore circonda chi confida nel Signore."],["Salmo 32,2","Beato l'uomo a cui Dio non imputa il delitto e nel cui spirito non è inganno."],["Salmo 32,7","Tu sei il mio rifugio, mi liberi dall'angoscia, mi circondi di canti di liberazione:"],["Salmo 32,8","»Ti istruirò e ti insegnerò la via da seguire; con gli occhi su di te, ti darò consiglio."],["Salmo 33,5","Egli ama la giustizia e il diritto; dell'amore del Signore è piena la terra."],["Salmo 33,6","Dalla parola del Signore furono fatti i cieli, dal soffio della sua bocca ogni loro schiera."],["Salmo 34,11","I leoni sono miseri e affamati, ma a chi cerca il Signore non manca alcun bene."],["Salmo 34,15","Sta' lontano dal male e fa' il bene, cerca e persegui la pace."],["Salmo 34,18","Gridano e il Signore li ascolta, li libera da tutte le loro angosce."],["Salmo 34,19","Il Signore è vicino a chi ha il cuore spezzato, egli salva gli spiriti affranti."],["Salmo 34,2-4","Benedirò il Signore in ogni tempo, sulla mia bocca sempre la sua lode. Io mi glorio nel Signore: i poveri ascoltino e si rallegrino. Magnificate con me il Signore, esaltiamo insieme il suo nome."],["Salmo 34,20","Molti sono i mali del giusto, ma da tutti lo libera il Signore."],["Salmo 34,5","Ho cercato il Signore: mi ha risposto e da ogni mia paura mi ha liberato."],["Salmo 34,8","L'angelo del Signore si accampa attorno a quelli che lo temono, e li libera."],["Salmo 34,9","Gustate e vedete com'è buono il Signore; beato l'uomo che in lui si rifugia."],["Salmo 36,6","Signore, il tuo amore è nel cielo, la tua fedeltà fino alle nubi,"],["Salmo 37,11","I poveri invece avranno in eredità la terra e godranno di una grande pace."],["Salmo 37,23-24","Il Signore rende sicuri i passi dell'uomo e si compiace della sua via. Se egli cade, non rimane a terra, perché il Signore sostiene la sua mano."],["Salmo 37,39","La salvezza dei giusti viene dal Signore: nel tempo dell'angoscia è loro fortezza."],["Salmo 37,4","Cerca la gioia nel Signore: esaudirà i desideri del tuo cuore."],["Salmo 37,5","Affida al Signore la tua via, confida in lui ed egli agirà:"],["Salmo 37,7","Sta' in silenzio davanti al Signore e spera in lui; non irritarti per chi ha successo, per l'uomo che trama insidie."],["Salmo 37,8","Desisti dall'ira e deponi lo sdegno, non irritarti: non ne verrebbe che male;"],["Salmo 4,9","In pace mi corico e subito mi addormento, perché tu solo, Signore, fiducioso mi fai riposare."],["Salmo 40,11-12","Non ho nascosto la tua giustizia dentro il mio cuore, la tua verità e la tua salvezza ho proclamato. Non ho celato il tuo amore e la tua fedeltà alla grande assemblea. Non rifiutarmi, Signore, la tua misericordia; il tuo amore e la tua fedeltà mi proteggano sempre,"],["Salmo 40,14","Dégnati, Signore, di liberarmi; Signore, vieni presto in mio aiuto."],["Salmo 40,18","Ma io sono povero e bisognoso: di me ha cura il Signore. Tu sei mio aiuto e mio liberatore: mio Dio, non tardare."],["Salmo 40,5","Beato l'uomo che ha posto la sua fiducia nel Signore e non si volge verso chi segue gli idoli né verso chi segue la menzogna."],["Salmo 40,9","di fare la tua volontà: mio Dio, questo io desidero; la tua legge è nel mio intimo»."],["Salmo 41,10","Anche l'amico in cui confidavo, che con me divideva il pane, contro di me alza il suo piede."],["Salmo 41,4","Il Signore lo sosterrà sul letto del dolore; tu lo assisti quando giace ammalato."],["Salmo 43,3-5","Manda la tua luce e la tua verità: siano esse a guidarmi, mi conducano alla tua santa montagna, alla tua dimora. Verrò all'altare di Dio, a Dio, mia gioiosa esultanza. A te canterò sulla cetra, Dio, Dio mio. Perché ti rattristi, anima mia, perché ti agiti in me? Spera in Dio: ancora potrò lodarlo, lui, salvezza del mio volto e mio Dio."],["Salmo 45,8","Ami la giustizia e la malvagità detesti: Dio, il tuo Dio, ti ha consacrato con olio di letizia, a preferenza dei tuoi compagni."],["Salmo 46,11","Fermatevi! Sappiate che io sono Dio, eccelso tra le genti, eccelso sulla terra."],["Salmo 46,2","Dio è per noi rifugio e fortezza, aiuto infallibile si è mostrato nelle angosce."],["Salmo 5,12","Gioiscano quanti in te si rifugiano, esultino senza fine. Proteggili, perché in te si allietino quanti amano il tuo nome,"],["Salmo 5,13","poiché tu benedici il giusto, Signore, come scudo lo circondi di benevolenza."],["Salmo 50,14","Offri a Dio come sacrificio la lode e sciogli all'Altissimo i tuoi voti;"],["Salmo 50,15","invocami nel giorno dell'angoscia: ti libererò e tu mi darai gloria»."],["Salmo 50,2","Da Sion, bellezza perfetta, Dio risplende."],["Salmo 50,23","Chi offre la lode in sacrificio, questi mi onora; a chi cammina per la retta via mostrerò la salvezza di Dio»."],["Salmo 51,12","Crea in me, o Dio, un cuore puro, rinnova in me uno spirito saldo."],["Salmo 51,14","Rendimi la gioia della tua salvezza, sostienimi con uno spirito generoso."],["Salmo 54,6","Ecco, Dio è il mio aiuto, il Signore sostiene la mia vita."],["Salmo 55,23","Affida al Signore il tuo peso ed egli ti sosterrà, mai permetterà che il giusto vacilli."],["Salmo 56,4-5","Nell'ora della paura io in te confido. In Dio, di cui lodo la parola, in Dio confido, non avrò timore: che cosa potrà farmi un essere di carne?"],["Salmo 57,3","Invocherò Dio, l'Altissimo, Dio che fa tutto per me."],["Salmo 57,9","svégliati, mio cuore, svegliatevi, arpa e cetra, voglio svegliare l'aurora."],["Salmo 59,17","Ma io canterò la tua forza, esalterò la tua fedeltà al mattino, perché sei stato mia difesa, mio rifugio nel giorno della mia angoscia."],["Salmo 61,4","Per me sei diventato un rifugio, una torre fortificata davanti al nemico."],["Salmo 62,2","Solo in Dio riposa l'anima mia: da lui la mia salvezza."],["Salmo 62,9","Confida in lui, o popolo, in ogni tempo; davanti a lui aprite il vostro cuore: nostro rifugio è Dio."],["Salmo 64,11","Il giusto gioirà nel Signore e riporrà in lui la sua speranza: si glorieranno tutti i retti di cuore."],["Salmo 66,18","Se nel mio cuore avessi cercato il male, il Signore non mi avrebbe ascoltato."],["Salmo 69,31","Loderò il nome di Dio con un canto, lo magnificherò con un ringraziamento,"],["Salmo 7,18","Renderò grazie al Signore per la sua giustizia e canterò il nome di Dio, l'Altissimo."],["Salmo 71,14","Io, invece, continuo a sperare; moltiplicherò le tue lodi."],["Salmo 71,20","Molte angosce e sventure mi hai fatto vedere: tu mi darai ancora vita, mi farai risalire dagli abissi della terra,"],["Salmo 71,8","Della tua lode è piena la mia bocca: tutto il giorno canto il tuo splendore."],["Salmo 72,19","E benedetto il suo nome glorioso per sempre: della sua gloria sia piena tutta la terra. Amen, amen."],["Salmo 73,26","Vengono meno la mia carne e il mio cuore; ma Dio è roccia del mio cuore, mia parte per sempre."],["Salmo 82,3-4","Difendete il debole e l'orfano, al povero e al misero fate giustizia! Salvate il debole e l'indigente, liberatelo dalla mano dei malvagi!»."],["Salmo 84,12","Perché sole e scudo è il Signore Dio; il Signore concede grazia e gloria, non rifiuta il bene a chi cammina nell'integrità."],["Salmo 85,13","Certo, il Signore donerà il suo bene e la nostra terra darà il suo frutto;"],["Salmo 86,15","Ma tu, Signore, Dio misericordioso e pietoso, lento all'ira e ricco di amore e di fedeltà,"],["Salmo 86,5","Tu sei buono, Signore, e perdoni, sei pieno di misericordia con chi t'invoca."],["Salmo 9,11","Confidino in te quanti conoscono il tuo nome, perché tu non abbandoni chi ti cerca, Signore."],["Salmo 90,14","Saziaci al mattino con il tuo amore: esulteremo e gioiremo per tutti i nostri giorni."],["Salmo 91,1-2","Chi abita al riparo dell'Altissimo passerà la notte all'ombra dell'Onnipotente. Io dico al Signore: «Mio rifugio e mia fortezza, mio Dio in cui confido»."],["Salmo 91,14-15","»Lo libererò, perché a me si è legato, lo porrò al sicuro, perché ha conosciuto il mio nome. Mi invocherà e io gli darò risposta; nell'angoscia io sarò con lui, lo libererò e lo renderò glorioso."],["Salmo 91,4","Ti coprirà con le sue penne, sotto le sue ali troverai rifugio; la sua fedeltà ti sarà scudo e corazza."],["Salmo 94,19","Nel mio intimo, fra molte preoccupazioni, il tuo conforto mi ha allietato."],["Salmo 95,6","Entrate: prostràti, adoriamo, in ginocchio davanti al Signore che ci ha fatti."],["Salmo 97,10","Odiate il male, voi che amate il Signore: egli custodisce la vita dei suoi fedeli, li libererà dalle mani dei malvagi."],["Salmo 99,3","Lodino il tuo nome grande e terribile. Egli è santo!"],["Sofonia 3,17","Il Signore, tuo Dio, in mezzo a te è un salvatore potente. Gioirà per te, ti rinnoverà con il suo amore, esulterà per te con grida di gioia»."],["Tito 2,11","È apparsa infatti la grazia di Dio, che porta salvezza a tutti gli uomini"],["Tito 2,14","Egli ha dato se stesso per noi, per riscattarci da ogni iniquità e formare per sé un popolo puro che gli appartenga, pieno di zelo per le opere buone."],["Tito 2,2","Gli uomini anziani siano sobri, dignitosi, saggi, saldi nella fede, nella carità e nella pazienza."],["Tito 2,4-5","per formare le giovani all'amore del marito e dei figli, a essere prudenti, caste, dedite alla famiglia, buone, sottomesse ai propri mariti, perché la parola di Dio non venga screditata."],["Tito 3,2","di non parlare male di nessuno, di evitare le liti, di essere mansueti, mostrando ogni mitezza verso tutti gli uomini."],["Tito 3,5","egli ci ha salvati, non per opere giuste da noi compiute, ma per la sua misericordia, con un'acqua che rigenera e rinnova nello Spirito Santo,"]];
const KEY = "versetti-salvati";
const $ = (id) => document.getElementById(id);
const pick = () => VERSES[Math.floor(Math.random() * VERSES.length)];
let cur = null;

const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (_) { return []; } };
const store = (a) => { try { localStorage.setItem(KEY, JSON.stringify(a)); return true; } catch (_) { return false; } };
const say = (m) => { $("msg").textContent = m; };

function refresh() {
  const a = load(), on = a.some((v) => v[0] === cur[0]);
  $("save").setAttribute("aria-pressed", String(on));
  $("save").textContent = on ? "Salvato ✓" : "Salva";
  $("list").textContent = `Salvati (${a.length})`;
  $("savedList").replaceChildren(...a.map((v) => {
    const li = document.createElement("li"), q = document.createElement("div"), s = document.createElement("small"), b = document.createElement("button");
    q.textContent = v[1]; s.textContent = v[0];
    b.className = "rm"; b.textContent = "Rimuovi";
    b.onclick = () => { store(load().filter((x) => x[0] !== v[0])); refresh(); };
    li.append(q, s, b);
    return li;
  }));
}

function show() {
  let v;
  do { v = pick(); } while (VERSES.length > 1 && cur && v[0] === cur[0]);
  cur = v; say("");
  $("text").textContent = v[1];
  $("ref").textContent = v[0];
  refresh();
}

$("again").onclick = show;
$("save").onclick = () => {
  const a = load();
  if (a.some((v) => v[0] === cur[0])) { store(a.filter((v) => v[0] !== cur[0])); say("Rimosso dai salvati"); }
  else say(store([...a, cur]) ? "Salvato su questo dispositivo" : "Salvataggio non disponibile in questo browser");
  refresh();
};
$("list").onclick = () => { $("saved").hidden = !$("saved").hidden; };
$("share").onclick = async () => {
  const text = `«${cur[1]}»\n— ${cur[0]} (CEI 2008)`, url = location.href;
  try {
    if (navigator.share) await navigator.share({ text, url });
    else { await navigator.clipboard.writeText(`${text}\n${url}`); say("Copiato negli appunti"); }
  } catch (e) { if (e.name !== "AbortError") say("Condivisione non riuscita"); }
};
show();
</script>
