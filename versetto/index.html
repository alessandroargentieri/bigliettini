<style>
  :root { --bg: #faf7f2; --fg: #2b2622; --muted: #7a7168; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1a18; --fg: #efe9e1; --muted: #a39a90; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 1.25rem/1.6 Georgia, serif; }
  main { max-width: 34rem; padding: 2rem 16px; text-align: center; }
  blockquote { margin: 0 0 1rem; }
  cite { color: var(--muted); font-size: 1rem; font-style: normal; }
  .actions { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; margin-top: 2rem; }
  button { margin-top: 0; padding: .6rem 1.2rem; font: 1rem system-ui; border: 1px solid var(--muted); border-radius: 999px; background: none; color: var(--fg); }
  button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  #msg { min-height: 1.2rem; margin-top: 1rem; color: var(--muted); font: .85rem system-ui; }
  #saved { margin-top: 2rem; text-align: left; font-size: 1rem; }
  #saved[hidden] { display: none; }
  #saved li { margin-bottom: 1rem; list-style: none; }
  #saved ul { padding: 0; }
  #saved small { display: block; color: var(--muted); font: .8rem system-ui; }
  #saved .rm { margin: .3rem 0 0; padding: .2rem .7rem; font-size: .75rem; }
  footer { margin-top: 2.5rem; color: var(--muted); font: .75rem/1.4 system-ui; }
  footer a { color: inherit; }
</style>

<script>
// versetti CEI 2008 incorporati: [riferimento, testo]
const VERSES = [["1 Corinzi 1,10","Vi esorto pertanto, fratelli, per il nome del Signore nostro Gesù Cristo, a essere tutti unanimi nel parlare, perché non vi siano divisioni tra voi, ma siate in perfetta unione di pensiero e di sentire."],["1 Corinzi 1,26-27","Considerate infatti la vostra chiamata, fratelli: non ci sono fra voi molti sapienti dal punto di vista umano, né molti potenti, né molti nobili. Ma quello che è stolto per il mondo, Dio lo ha scelto per confondere i sapienti; quello che è debole per il mondo, Dio lo ha scelto per confondere i forti;"],["1 Corinzi 1,30","Grazie a lui voi siete in Cristo Gesù, il quale per noi è diventato sapienza per opera di Dio, giustizia, santificazione e redenzione,"],["1 Corinzi 1,4","Rendo grazie continuamente al mio Dio per voi, a motivo della grazia di Dio che vi è stata data in Cristo Gesù,"],["1 Corinzi 1,9","Degno di fede è Dio, dal quale siete stati chiamati alla comunione con il Figlio suo Gesù Cristo, Signore nostro!"],["1 Corinzi 10,13","Nessuna tentazione, superiore alle forze umane, vi ha sorpresi; Dio infatti è degno di fede e non permetterà che siate tentati oltre le vostre forze ma, insieme con la tentazione, vi darà anche il modo di uscirne per poterla sostenere."],["1 Corinzi 10,23","«Tutto è lecito! . Sì, ma non tutto giova. «Tutto è lecito! . Sì, ma non tutto edifica."],["1 Corinzi 10,24","Nessuno cerchi il proprio interesse, ma quello degli altri."],["1 Corinzi 10,31","Dunque, sia che mangiate sia che beviate sia che facciate qualsiasi altra cosa, fate tutto per la gloria di Dio."],["1 Corinzi 12,12","Come infatti il corpo è uno solo e ha molte membra, e tutte le membra del corpo, pur essendo molte, sono un corpo solo, così anche il Cristo."],["1 Corinzi 12,26","Quindi se un membro soffre, tutte le membra soffrono insieme; e se un membro è onorato, tutte le membra gioiscono con lui."],["1 Corinzi 12,4","Vi sono diversi carismi, ma uno solo è lo Spirito;"],["1 Corinzi 13,13","Ora dunque rimangono queste tre cose: la fede, la speranza e la carità. Ma la più grande di tutte è la carità!"],["1 Corinzi 13,4-5","La carità è magnanima, benevola è la carità; non è invidiosa, non si vanta, non si gonfia d'orgoglio, non manca di rispetto, non cerca il proprio interesse, non si adira, non tiene conto del male ricevuto,"],["1 Corinzi 13,7","Tutto scusa, tutto crede, tutto spera, tutto sopporta."],["1 Corinzi 13,8","La carità non avrà mai fine. Le profezie scompariranno, il dono delle lingue cesserà e la conoscenza svanirà."],["1 Corinzi 14,33","perché Dio non è un Dio di disordine, ma di pace. Come in tutte le comunità dei santi,"],["1 Corinzi 15,10","Per grazia di Dio, però, sono quello che sono, e la sua grazia in me non è stata vana. Anzi, ho faticato più di tutti loro, non io però, ma la grazia di Dio che è con me."],["1 Corinzi 15,57","Siano rese grazie a Dio, che ci dà la vittoria per mezzo del Signore nostro Gesù Cristo!"],["1 Corinzi 15,58","Perciò, fratelli miei carissimi, rimanete saldi e irremovibili, progredendo sempre più nell'opera del Signore, sapendo che la vostra fatica non è vana nel Signore."],["1 Corinzi 16,13","Vigilate, state saldi nella fede, comportatevi in modo virile, siate forti."],["1 Corinzi 16,14","Tutto si faccia tra voi nella carità."],["1 Corinzi 2,5","perché la vostra fede non fosse fondata sulla sapienza umana, ma sulla potenza di Dio."],["1 Corinzi 2,9","Ma, come sta scritto: Quelle cose che occhio non vide, né orecchio udì, né mai entrarono in cuore di uomo, Dio le ha preparate per coloro che lo amano ."],["1 Corinzi 3,16","Non sapete che siete tempio di Dio e che lo Spirito di Dio abita in voi?"],["1 Corinzi 3,18","Nessuno si illuda. Se qualcuno tra voi si crede un sapiente in questo mondo, si faccia stolto per diventare sapiente,"],["1 Corinzi 4,2","Ora, ciò che si richiede agli amministratori è che ognuno risulti fedele."],["1 Corinzi 4,7","Chi dunque ti dà questo privilegio? Che cosa possiedi che tu non l'abbia ricevuto? E se l'hai ricevuto, perché te ne vanti come se non l'avessi ricevuto?"],["1 Corinzi 6,12","«Tutto mi è lecito! . Sì, ma non tutto giova. «Tutto mi è lecito! . Sì, ma non mi lascerò dominare da nulla."],["1 Corinzi 6,19-20","Non sapete che il vostro corpo è tempio dello Spirito Santo, che è in voi? Lo avete ricevuto da Dio e voi non appartenete a voi stessi. Infatti siete stati comprati a caro prezzo: glorificate dunque Dio nel vostro corpo!"],["1 Corinzi 7,17","Fuori di questi casi, ciascuno - come il Signore gli ha assegnato - continui a vivere come era quando Dio lo ha chiamato; così dispongo in tutte le Chiese."],["1 Corinzi 8,6","per noi c'è un solo Dio, il Padre, dal quale tutto proviene e noi siamo per lui; e un solo Signore, Gesù Cristo, in virtù del quale esistono tutte le cose e noi esistiamo grazie a lui."],["1 Cronache 16,11","Cercate il Signore e la sua potenza, ricercate sempre il suo volto."],["1 Cronache 16,34","Rendete grazie al Signore perché è buono, perché il suo amore è per sempre."],["1 Cronache 22,13","Allora riuscirai, se cercherai di praticare le leggi e le norme che il Signore ha prescritto a Mosè per Israele. Sii forte e coraggioso; non temere e non abbatterti."],["1 Cronache 28,20","Davide disse a Salomone, suo figlio: «Sii forte e coraggioso; mettiti al lavoro, non temere e non abbatterti, perché il Signore Dio, il mio Dio, è con te. Non ti lascerà e non ti abbandonerà finché tu non abbia terminato tutto il lavoro per il tempio del Signore."],["1 Giovanni 1,5","Questo è il messaggio che abbiamo udito da lui e che noi vi annunciamo: Dio è luce e in lui non c'è tenebra alcuna."],["1 Giovanni 1,6","Se diciamo di essere in comunione con lui e camminiamo nelle tenebre, siamo bugiardi e non mettiamo in pratica la verità."],["1 Giovanni 1,7","Ma se camminiamo nella luce, come egli è nella luce, siamo in comunione gli uni con gli altri, e il sangue di Gesù, il Figlio suo, ci purifica da ogni peccato."],["1 Giovanni 1,9","Se confessiamo i nostri peccati, egli è fedele e giusto tanto da perdonarci i peccati e purificarci da ogni iniquità."],["1 Giovanni 2,2","È lui la vittima di espiazione per i nostri peccati; non soltanto per i nostri, ma anche per quelli di tutto il mondo."],["1 Giovanni 2,29","Se sapete che egli è giusto, sappiate anche che chiunque opera la giustizia, è stato generato da lui."],["1 Giovanni 2,6","Chi dice di rimanere in lui, deve anch'egli comportarsi come lui si è comportato."],["1 Giovanni 2,9-11","Chi dice di essere nella luce e odia suo fratello, è ancora nelle tenebre. Chi ama suo fratello, rimane nella luce e non vi è in lui occasione di inciampo. Ma chi odia suo fratello, è nelle tenebre, cammina nelle tenebre e non sa dove va, perché le tenebre hanno accecato i suoi occhi."],["1 Giovanni 3,1","Vedete quale grande amore ci ha dato il Padre per essere chiamati figli di Dio, e lo siamo realmente! Per questo il mondo non ci conosce: perché non ha conosciuto lui."],["1 Giovanni 3,11","Poiché questo è il messaggio che avete udito da principio: che ci amiamo gli uni gli altri."],["1 Giovanni 3,16","In questo abbiamo conosciuto l'amore, nel fatto che egli ha dato la sua vita per noi; quindi anche noi dobbiamo dare la vita per i fratelli."],["1 Giovanni 3,17","Ma se uno ha ricchezze di questo mondo e, vedendo il suo fratello in necessità, gli chiude il proprio cuore, come rimane in lui l'amore di Dio?"],["1 Giovanni 3,18","Figlioli, non amiamo a parole né con la lingua, ma con i fatti e nella verità."],["1 Giovanni 3,20-21","qualunque cosa esso ci rimproveri. Dio è più grande del nostro cuore e conosce ogni cosa. Carissimi, se il nostro cuore non ci rimprovera nulla, abbiamo fiducia in Dio,"],["1 Giovanni 3,22","e qualunque cosa chiediamo, la riceviamo da lui, perché osserviamo i suoi comandamenti e facciamo quello che gli è gradito."],["1 Giovanni 3,7","Figlioli, nessuno v'inganni. Chi pratica la giustizia è giusto come egli è giusto."],["1 Giovanni 3,9","Chiunque è stato generato da Dio non commette peccato, perché un germe divino rimane in lui, e non può peccare perché è stato generato da Dio."],["1 Giovanni 4,1","Carissimi, non prestate fede ad ogni spirito, ma mettete alla prova gli spiriti, per saggiare se provengono veramente da Dio, perché molti falsi profeti sono venuti nel mondo."],["1 Giovanni 4,10","In questo sta l'amore: non siamo stati noi ad amare Dio, ma è lui che ha amato noi e ha mandato il suo Figlio come vittima di espiazione per i nostri peccati."],["1 Giovanni 4,11","Carissimi, se Dio ci ha amati così, anche noi dobbiamo amarci gli uni gli altri."],["1 Giovanni 4,12","Nessuno mai ha visto Dio; se ci amiamo gli uni gli altri, Dio rimane in noi e l'amore di lui è perfetto in noi."],["1 Giovanni 4,16","E noi abbiamo conosciuto e creduto l'amore che Dio ha in noi. Dio è amore; chi rimane nell'amore rimane in Dio e Dio rimane in lui."],["1 Giovanni 4,18","Nell'amore non c'è timore, al contrario l'amore perfetto scaccia il timore, perché il timore suppone un castigo e chi teme non è perfetto nell'amore."],["1 Giovanni 4,19","Noi amiamo perché egli ci ha amati per primo."],["1 Giovanni 4,20","Se uno dice: «Io amo Dio» e odia suo fratello, è un bugiardo. Chi infatti non ama il proprio fratello che vede, non può amare Dio che non vede."],["1 Giovanni 4,21","E questo è il comandamento che abbiamo da lui: chi ama Dio, ami anche suo fratello."],["1 Giovanni 4,4","Voi siete da Dio, figlioli, e avete vinto costoro, perché colui che è in voi è più grande di colui che è nel mondo."],["1 Giovanni 4,7","Carissimi, amiamoci gli uni gli altri, perché l'amore è da Dio: chiunque ama è stato generato da Dio e conosce Dio."],["1 Giovanni 4,8","Chi non ama non ha conosciuto Dio, perché Dio è amore."],["1 Giovanni 5,11-13","E la testimonianza è questa: Dio ci ha donato la vita eterna e questa vita è nel suo Figlio. Chi ha il Figlio, ha la vita; chi non ha il Figlio di Dio, non ha la vita. Questo vi ho scritto perché sappiate che possedete la vita eterna, voi che credete nel nome del Figlio di Dio."],["1 Giovanni 5,14","E questa è la fiducia che abbiamo in lui: qualunque cosa gli chiediamo secondo la sua volontà, egli ci ascolta."],["1 Giovanni 5,15","E se sappiamo che ci ascolta in tutto quello che gli chiediamo, sappiamo di avere già da lui quanto abbiamo chiesto."],["1 Giovanni 5,18","Sappiamo che chiunque è stato generato da Dio non pecca: chi è stato generato da Dio preserva se stesso e il Maligno non lo tocca."],["1 Giovanni 5,3","In questo infatti consiste l'amore di Dio, nell'osservare i suoi comandamenti; e i suoi comandamenti non sono gravosi."],["1 Giovanni 5,4","Chiunque è stato generato da Dio vince il mondo; e questa è la vittoria che ha vinto il mondo: la nostra fede."],["1 Giovanni 5,5","E chi è che vince il mondo se non chi crede che Gesù è il Figlio di Dio?"],["1 Pietro 1,13","Perciò, cingendo i fianchi della vostra mente e restando sobri, ponete tutta la vostra speranza in quella grazia che vi sarà data quando Gesù Cristo si manifesterà."],["1 Pietro 1,14","Come figli obbedienti, non conformatevi ai desideri di un tempo, quando eravate nell'ignoranza,"],["1 Pietro 1,18-19","Voi sapete che non a prezzo di cose effimere, come argento e oro, foste liberati dalla vostra vuota condotta, ereditata dai padri, ma con il sangue prezioso di Cristo, agnello senza difetti e senza macchia."],["1 Pietro 1,22","Dopo aver purificato le vostre anime con l'obbedienza alla verità per amarvi sinceramente come fratelli, amatevi intensamente, di vero cuore, gli uni gli altri,"],["1 Pietro 1,23","rigenerati non da un seme corruttibile ma incorruttibile, per mezzo della parola di Dio viva ed eterna."],["1 Pietro 1,25","ma la parola del Signore rimane in eterno. E questa è la parola del Vangelo che vi è stato annunciato."],["1 Pietro 1,3","Sia benedetto Dio e Padre del Signore nostro Gesù Cristo, che nella sua grande misericordia ci ha rigenerati, mediante la risurrezione di Gesù Cristo dai morti, per una speranza viva,"],["1 Pietro 1,4","per un'eredità che non si corrompe, non si macchia e non marcisce. Essa è conservata nei cieli per voi,"],["1 Pietro 1,6-7","Perciò siete ricolmi di gioia, anche se ora dovete essere, per un po' di tempo, afflitti da varie prove, affinché la vostra fede, messa alla prova, molto più preziosa dell'oro - destinato a perire e tuttavia purificato con fuoco - torni a vostra lode, gloria e onore quando Gesù Cristo si manifesterà."],["1 Pietro 2,16","come uomini liberi, servendovi della libertà non come di un velo per coprire la malizia, ma come servi di Dio."],["1 Pietro 2,2","Come bambini appena nati desiderate avidamente il genuino latte spirituale, grazie al quale voi possiate crescere verso la salvezza,"],["1 Pietro 2,21","A questo infatti siete stati chiamati, perché anche Cristo patì per voi, lasciandovi un esempio, perché ne seguiate le orme:"],["1 Pietro 2,24","Egli portò i nostri peccati nel suo corpo sul legno della croce, perché, non vivendo più per il peccato, vivessimo per la giustizia; dalle sue piaghe siete stati guariti ."],["1 Pietro 2,25","Eravate erranti come pecore , ma ora siete stati ricondotti al pastore e custode delle vostre anime."],["1 Pietro 2,9","Voi invece siete stirpe eletta, sacerdozio regale, nazione santa, popolo che Dio si è acquistato perché proclami le opere ammirevoli di lui, che vi ha chiamato dalle tenebre alla sua luce meravigliosa."],["1 Pietro 3,10-12","Chi infatti vuole amare la vita e vedere giorni felici trattenga la lingua dal male e le labbra da parole d'inganno, eviti il male e faccia il bene, cerchi la pace e la segua, perché gli occhi del Signore sono sopra i giusti e le sue orecchie sono attente alle loro preghiere; ma il volto del Signore è contro coloro che fanno il male ."],["1 Pietro 3,14","Se poi doveste soffrire per la giustizia, beati voi! Non sgomentatevi per paura di loro e non turbatevi,"],["1 Pietro 3,15","ma adorate il Signore , Cristo, nei vostri cuori, pronti sempre a rispondere a chiunque vi domandi ragione della speranza che è in voi."],["1 Pietro 3,8","E infine siate tutti concordi, partecipi delle gioie e dei dolori degli altri, animati da affetto fraterno, misericordiosi, umili."],["1 Pietro 3,9","Non rendete male per male né ingiuria per ingiuria, ma rispondete augurando il bene. A questo infatti siete stati chiamati da Dio per avere in eredità la sua benedizione."],["1 Pietro 4,10","Ciascuno, secondo il dono ricevuto, lo metta a servizio degli altri, come buoni amministratori della multiforme grazia di Dio."],["1 Pietro 4,19","Perciò anche quelli che soffrono secondo il volere di Dio, consegnino la loro vita al Creatore fedele, compiendo il bene."],["1 Pietro 4,8","Soprattutto conservate tra voi una carità fervente, perché la carità copre una moltitudine di peccati."],["1 Pietro 4,9","Praticate l'ospitalità gli uni verso gli altri, senza mormorare."],["1 Pietro 5,10","E il Dio di ogni grazia, il quale vi ha chiamati alla sua gloria eterna in Cristo Gesù, egli stesso, dopo che avrete un poco sofferto, vi ristabilirà, vi confermerà, vi rafforzerà, vi darà solide fondamenta."],["1 Pietro 5,3","non come padroni delle persone a voi affidate, ma facendovi modelli del gregge."],["1 Pietro 5,4","E quando apparirà il Pastore supremo, riceverete la corona della gloria che non appassisce."],["1 Pietro 5,5","Anche voi, giovani, siate sottomessi agli anziani. Rivestitevi tutti di umiltà gli uni verso gli altri, perché Dio resiste ai superbi, ma dà grazia agli umili ."],["1 Pietro 5,6","Umiliatevi dunque sotto la potente mano di Dio, affinché vi esalti al tempo opportuno,"],["1 Pietro 5,7","riversando su di lui ogni vostra preoccupazione, perché egli ha cura di voi."],["1 Samuele 12,24","Solo temete il Signore e servitelo fedelmente con tutto il cuore: considerate infatti le grandi cose che ha operato tra voi."],["1 Samuele 15,22","Samuele esclamò: «Il Signore gradisce forse gli olocausti e i sacrifici quanto l'obbedienza alla voce del Signore? Ecco, obbedire è meglio del sacrificio, essere docili è meglio del grasso degli arieti."],["1 Samuele 26,23","Il Signore renderà a ciascuno secondo la sua giustizia e la sua fedeltà, dal momento che oggi il Signore ti aveva messo nelle mie mani e non ho voluto stendere la mano sul consacrato del Signore."],["1 Tessalonicesi 4,18","Confortatevi dunque a vicenda con queste parole."],["1 Tessalonicesi 4,9","Riguardo all'amore fraterno, non avete bisogno che ve ne scriva; voi stessi infatti avete imparato da Dio ad amarvi gli uni gli altri,"],["1 Tessalonicesi 5,11","Perciò confortatevi a vicenda e siate di aiuto gli uni agli altri, come già fate."],["1 Tessalonicesi 5,13","trattateli con molto rispetto e amore, a motivo del loro lavoro. Vivete in pace tra voi."],["1 Tessalonicesi 5,14","Vi esortiamo, fratelli: ammonite chi è indisciplinato, fate coraggio a chi è scoraggiato, sostenete chi è debole, siate magnanimi con tutti."],["1 Tessalonicesi 5,16","Siate sempre lieti,"],["1 Tessalonicesi 5,17","pregate ininterrottamente,"],["1 Tessalonicesi 5,18","in ogni cosa rendete grazie: questa infatti è volontà di Dio in Cristo Gesù verso di voi."],["1 Tessalonicesi 5,24","Degno di fede è colui che vi chiama: egli farà tutto questo!"],["1 Timoteo 1,14","e così la grazia del Signore nostro ha sovrabbondato insieme alla fede e alla carità che è in Cristo Gesù."],["1 Timoteo 1,16","Ma appunto per questo ho ottenuto misericordia, perché Cristo Gesù ha voluto in me, per primo, dimostrare tutta quanta la sua magnanimità, e io fossi di esempio a quelli che avrebbero creduto in lui per avere la vita eterna."],["1 Timoteo 2,5","Uno solo, infatti, è Dio e uno solo anche il mediatore fra Dio e gli uomini, l'uomo Cristo Gesù,"],["1 Timoteo 6,12","Combatti la buona battaglia della fede, cerca di raggiungere la vita eterna alla quale sei stato chiamato e per la quale hai fatto la tua bella professione di fede davanti a molti testimoni."],["1 Timoteo 6,17-19","A quelli che sono ricchi in questo mondo ordina di non essere orgogliosi, di non porre la speranza nell'instabilità delle ricchezze, ma in Dio, che tutto ci dà con abbondanza perché possiamo goderne. Facciano del bene, si arricchiscano di opere buone, siano pronti a dare e a condividere: così si metteranno da parte un buon capitale per il futuro, per acquistarsi la vita vera."],["2 Corinzi 1,22","ci ha impresso il sigillo e ci ha dato la caparra dello Spirito nei nostri cuori."],["2 Corinzi 1,3-4","Sia benedetto Dio, Padre del Signore nostro Gesù Cristo, Padre misericordioso e Dio di ogni consolazione! Egli ci consola in ogni nostra tribolazione, perché possiamo anche noi consolare quelli che si trovano in ogni genere di afflizione con la consolazione con cui noi stessi siamo consolati da Dio."],["2 Corinzi 12,9","Ed egli mi ha detto: «Ti basta la mia grazia; la forza infatti si manifesta pienamente nella debolezza». Mi vanterò quindi ben volentieri delle mie debolezze, perché dimori in me la potenza di Cristo."],["2 Corinzi 2,14","Siano rese grazie a Dio, il quale sempre ci fa partecipare al suo trionfo in Cristo e diffonde ovunque per mezzo nostro il profumo della sua conoscenza!"],["2 Corinzi 3,12","Forti di tale speranza, ci comportiamo con molta franchezza"],["2 Corinzi 3,17","Il Signore è lo Spirito e, dove c'è lo Spirito del Signore, c'è libertà."],["2 Corinzi 3,18","E noi tutti, a viso scoperto, riflettendo come in uno specchio la gloria del Signore, veniamo trasformati in quella medesima immagine, di gloria in gloria, secondo l'azione dello Spirito del Signore."],["2 Corinzi 3,5","Non che da noi stessi siamo capaci di pensare qualcosa come proveniente da noi, ma la nostra capacità viene da Dio,"],["2 Corinzi 4,16","Per questo non ci scoraggiamo, ma, se anche il nostro uomo esteriore si va disfacendo, quello interiore invece si rinnova di giorno in giorno."],["2 Corinzi 4,18","noi non fissiamo lo sguardo sulle cose visibili, ma su quelle invisibili, perché le cose visibili sono di un momento, quelle invisibili invece sono eterne."],["2 Corinzi 4,6","E Dio, che disse: «Rifulga la luce dalle tenebre», rifulse nei nostri cuori, per far risplendere la conoscenza della gloria di Dio sul volto di Cristo."],["2 Corinzi 5,17","Tanto che, se uno è in Cristo, è una nuova creatura; le cose vecchie sono passate; ecco, ne sono nate di nuove."],["2 Corinzi 5,21","Colui che non aveva conosciuto peccato, Dio lo fece peccato in nostro favore, perché in lui noi potessimo diventare giustizia di Dio."],["2 Corinzi 5,7","camminiamo infatti nella fede e non nella visione -,"],["2 Corinzi 5,8","siamo pieni di fiducia e preferiamo andare in esilio dal corpo e abitare presso il Signore."],["2 Corinzi 6,2","Egli dice infatti: Al momento favorevole ti ho esaudito e nel giorno della salvezza ti ho soccorso . Ecco ora il momento favorevole, ecco ora il giorno della salvezza!"],["2 Corinzi 8,21","Ci preoccupiamo infatti di comportarci bene non soltanto davanti al Signore, ma anche davanti agli uomini."],["2 Corinzi 8,7","E come siete ricchi in ogni cosa, nella fede, nella parola, nella conoscenza, in ogni zelo e nella carità che vi abbiamo insegnato, così siate larghi anche in quest'opera generosa."],["2 Corinzi 9,15","Grazie a Dio per questo suo dono ineffabile!"],["2 Corinzi 9,7","Ciascuno dia secondo quanto ha deciso nel suo cuore, non con tristezza né per forza, perché Dio ama chi dona con gioia."],["2 Corinzi 9,8","Del resto, Dio ha potere di far abbondare in voi ogni grazia perché, avendo sempre il necessario in tutto, possiate compiere generosamente tutte le opere di bene."],["2 Cronache 15,7","Ma voi siate forti e le vostre mani non crollino, perché c'è una ricompensa per le vostre azioni»."],["2 Cronache 19,9","Egli comandò loro: «Voi agirete nel timore del Signore, con fedeltà e con cuore integro."],["2 Cronache 7,14","se il mio popolo, sul quale è stato invocato il mio nome, si umilierà, pregherà e ricercherà il mio volto, e si convertirà dalle sue vie malvagie, ascolterò dal cielo e perdonerò il suo peccato e risanerò la sua terra."],["2 Giovanni 1,9","Chi va oltre e non rimane nella dottrina del Cristo, non possiede Dio. Chi invece rimane nella dottrina, possiede il Padre e il Figlio."],["2 Samuele 22,2","Egli disse: «Signore, mia roccia, mia fortezza, mio liberatore,"],["2 Samuele 22,3-4","mio Dio, mia rupe, in cui mi rifugio; mio scudo, mia potente salvezza e mio baluardo, mio nascondiglio che mi salva, dalla violenza tu mi salvi. Invoco il Signore, degno di lode, e sarò salvato dai miei nemici."],["2 Tessalonicesi 1,11","Per questo preghiamo continuamente per voi, perché il nostro Dio vi renda degni della sua chiamata e, con la sua potenza, porti a compimento ogni proposito di bene e l'opera della vostra fede,"],["2 Tessalonicesi 1,3","Dobbiamo sempre rendere grazie a Dio per voi, fratelli, come è giusto, perché la vostra fede fa grandi progressi e l'amore di ciascuno di voi verso gli altri va crescendo."],["2 Tessalonicesi 2,15","Perciò, fratelli, state saldi e mantenete le tradizioni che avete appreso sia dalla nostra parola sia dalla nostra lettera."],["2 Tessalonicesi 3,13","Ma voi, fratelli, non stancatevi di fare il bene."],["2 Tessalonicesi 3,16","Il Signore della pace vi dia la pace sempre e in ogni modo. Il Signore sia con tutti voi."],["2 Tessalonicesi 3,3","Ma il Signore è fedele: egli vi confermerà e vi custodirà dal Maligno."],["2 Tessalonicesi 3,5","Il Signore guidi i vostri cuori all'amore di Dio e alla pazienza di Cristo."],["2 Timoteo 1,12","È questa la causa dei mali che soffro, ma non me ne vergogno: so infatti in chi ho posto la mia fede e sono convinto che egli è capace di custodire fino a quel giorno ciò che mi è stato affidato."],["2 Timoteo 1,7","Dio infatti non ci ha dato uno spirito di timidezza, ma di forza, di carità e di prudenza."],["2 Timoteo 1,9","Egli infatti ci ha salvati e ci ha chiamati con una vocazione santa, non già in base alle nostre opere, ma secondo il suo progetto e la sua grazia. Questa ci è stata data in Cristo Gesù fin dall'eternità,"],["2 Timoteo 2,13","se siamo infedeli, lui rimane fedele, perché non può rinnegare se stesso."],["2 Timoteo 2,15","Sfòrzati di presentarti a Dio come una persona degna, un lavoratore che non deve vergognarsi e che dispensa rettamente la parola della verità."],["2 Timoteo 2,24-26","Un servo del Signore non deve essere litigioso, ma mite con tutti, capace di insegnare, paziente, dolce nel rimproverare quelli che gli si mettono contro, nella speranza che Dio conceda loro di convertirsi, perché riconoscano la verità e rientrino in se stessi, liberandosi dal laccio del diavolo, che li tiene prigionieri perché facciano la sua volontà."],["2 Timoteo 3,14-15","Tu però rimani saldo in quello che hai imparato e che credi fermamente. Conosci coloro da cui lo hai appreso e conosci le sacre Scritture fin dall'infanzia: queste possono istruirti per la salvezza, che si ottiene mediante la fede in Cristo Gesù."],["2 Timoteo 3,16-17","Tutta la Scrittura, ispirata da Dio, è anche utile per insegnare, convincere, correggere ed educare nella giustizia, perché l'uomo di Dio sia completo e ben preparato per ogni opera buona."],["2 Timoteo 4,18","Il Signore mi libererà da ogni male e mi porterà in salvo nei cieli, nel suo regno; a lui la gloria nei secoli dei secoli. Amen."],["2 Timoteo 4,3-4","Verrà giorno, infatti, in cui non si sopporterà più la sana dottrina, ma, pur di udire qualcosa, gli uomini si circonderanno di maestri secondo i propri capricci, rifiutando di dare ascolto alla verità per perdersi dietro alle favole."],["2 Timoteo 4,7","Ho combattuto la buona battaglia, ho terminato la corsa, ho conservato la fede."],["Abacuc 2,14","Poiché la terra si riempirà della conoscenza della gloria del Signore, come le acque ricoprono il mare."],["Abacuc 2,3","È una visione che attesta un termine, parla di una scadenza e non mentisce; se indugia, attendila, perché certo verrà e non tarderà."],["Abacuc 2,4","Ecco, soccombe colui che non ha l'animo retto, mentre il giusto vivrà per la sua fede»."],["Abacuc 3,19","Il Signore Dio è la mia forza, egli rende i miei piedi come quelli delle cerve e sulle mie alture mi fa camminare."],["Apocalisse 21,1","E vidi un cielo nuovo e una terra nuova: il cielo e la terra di prima infatti erano scomparsi e il mare non c'era più."],["Apocalisse 21,11","Il suo splendore è simile a quello di una gemma preziosissima, come pietra di diaspro cristallino."],["Apocalisse 21,23","La città non ha bisogno della luce del sole, né della luce della luna: la gloria di Dio la illumina e la sua lampada è l'Agnello."],["Apocalisse 21,4","E asciugherà ogni lacrima dai loro occhi e non vi sarà più la morte né lutto né lamento né affanno, perché le cose di prima sono passate»."],["Apocalisse 21,5","E Colui che sedeva sul trono disse: «Ecco, io faccio nuove tutte le cose». E soggiunse: «Scrivi, perché queste parole sono certe e vere»."],["Apocalisse 22,5","Non vi sarà più notte, e non avranno più bisogno di luce di lampada né di luce di sole, perché il Signore Dio li illuminerà. E regneranno nei secoli dei secoli."],["Atti 10,34-35","Pietro allora prese la parola e disse: «In verità sto rendendomi conto che Dio non fa preferenza di persone, ma accoglie chi lo teme e pratica la giustizia, a qualunque nazione appartenga."],["Atti 10,38","cioè come Dio consacrò in Spirito Santo e potenza Gesù di Nàzaret, il quale passò beneficando e risanando tutti coloro che stavano sotto il potere del diavolo, perché Dio era con lui."],["Atti 10,43","A lui tutti i profeti danno questa testimonianza: chiunque crede in lui riceve il perdono dei peccati per mezzo del suo nome»."],["Atti 13,2","Mentre essi stavano celebrando il culto del Signore e digiunando, lo Spirito Santo disse: «Riservate per me Bàrnaba e Saulo per l'opera alla quale li ho chiamati»."],["Atti 13,38-39","Vi sia dunque noto, fratelli, che per opera sua viene annunciato a voi il perdono dei peccati. Da tutte le cose da cui mediante la legge di Mosè non vi fu possibile essere giustificati, per mezzo di lui chiunque crede è giustificato."],["Atti 13,47","Così infatti ci ha ordinato il Signore: Io ti ho posto per essere luce delle genti, perché tu porti la salvezza sino all'estremità della terra »."],["Atti 14,8-10","C'era a Listra un uomo paralizzato alle gambe, storpio sin dalla nascita, che non aveva mai camminato. Egli ascoltava Paolo mentre parlava e questi, fissandolo con lo sguardo e vedendo che aveva fede di essere salvato, disse a gran voce: «Àlzati, ritto in piedi!». Egli balzò in piedi e si mise a camminare."],["Atti 16,31","Risposero: «Credi nel Signore Gesù e sarai salvato tu e la tua famiglia»."],["Atti 16,33-34","Egli li prese con sé, a quell'ora della notte, ne lavò le piaghe e subito fu battezzato lui con tutti i suoi; poi li fece salire in casa, apparecchiò la tavola e fu pieno di gioia insieme a tutti i suoi per avere creduto in Dio."],["Atti 17,11","Questi erano di sentimenti più nobili di quelli di Tessalònica e accolsero la Parola con grande entusiasmo, esaminando ogni giorno le Scritture per vedere se le cose stavano davvero così."],["Atti 2,21","E avverrà : chiunque invocherà il nome del Signore sarà salvato ."],["Atti 2,38","E Pietro disse loro: «Convertitevi e ciascuno di voi si faccia battezzare nel nome di Gesù Cristo, per il perdono dei vostri peccati, e riceverete il dono dello Spirito Santo."],["Atti 2,39","Per voi infatti è la promessa e per i vostri figli e per tutti quelli che sono lontani, quanti ne chiamerà il Signore Dio nostro»."],["Atti 2,44-45","Tutti i credenti stavano insieme e avevano ogni cosa in comune; vendevano le loro proprietà e sostanze e le dividevano con tutti, secondo il bisogno di ciascuno."],["Atti 20,35","In tutte le maniere vi ho mostrato che i deboli si devono soccorrere lavorando così, ricordando le parole del Signore Gesù, che disse: «Si è più beati nel dare che nel ricevere!»»."],["Atti 22,16","E ora, perché aspetti? Àlzati, fatti battezzare e purificare dai tuoi peccati, invocando il suo nome»."],["Atti 24,3","le accogliamo in tutto e per tutto, eccellentissimo Felice, con profonda gratitudine."],["Atti 26,16","Ma ora àlzati e sta' in piedi; io ti sono apparso infatti per costituirti ministro e testimone di quelle cose che hai visto di me e di quelle per cui ti apparirò."],["Atti 28,31","annunciando il regno di Dio e insegnando le cose riguardanti il Signore Gesù Cristo, con tutta franchezza e senza impedimento."],["Atti 3,19","Convertitevi dunque e cambiate vita, perché siano cancellati i vostri peccati"],["Atti 4,12","In nessun altro c'è salvezza; non vi è infatti, sotto il cielo, altro nome dato agli uomini, nel quale è stabilito che noi siamo salvati»."],["Atti 4,13","Vedendo la franchezza di Pietro e di Giovanni e rendendosi conto che erano persone semplici e senza istruzione, rimanevano stupiti e li riconoscevano come quelli che erano stati con Gesù."],["Atti 4,29","E ora, Signore, volgi lo sguardo alle loro minacce e concedi ai tuoi servi di proclamare con tutta franchezza la tua parola,"],["Atti 4,31","Quand'ebbero terminato la preghiera, il luogo in cui erano radunati tremò e tutti furono colmati di Spirito Santo e proclamavano la parola di Dio con franchezza."],["Atti 4,32","La moltitudine di coloro che erano diventati credenti aveva un cuore solo e un'anima sola e nessuno considerava sua proprietà quello che gli apparteneva, ma fra loro tutto era comune."],["Atti 5,29","Rispose allora Pietro insieme agli apostoli: «Bisogna obbedire a Dio invece che agli uomini."],["Atti 8,38-39","Fece fermare il carro e scesero tutti e due nell'acqua, Filippo e l'eunuco, ed egli lo battezzò. Quando risalirono dall'acqua, lo Spirito del Signore rapì Filippo e l'eunuco non lo vide più; e, pieno di gioia, proseguiva la sua strada."],["Colossesi 1,11","Resi forti di ogni fortezza secondo la potenza della sua gloria, per essere perseveranti e magnanimi in tutto,"],["Colossesi 1,14","per mezzo del quale abbiamo la redenzione, il perdono dei peccati."],["Colossesi 1,16-17","perché in lui furono create tutte le cose nei cieli e sulla terra, quelle visibili e quelle invisibili: Troni, Dominazioni, Principati e Potenze. Tutte le cose sono state create per mezzo di lui e in vista di lui. Egli è prima di tutte le cose e tutte in lui sussistono."],["Colossesi 1,20-22","e che per mezzo di lui e in vista di lui siano riconciliate tutte le cose, avendo pacificato con il sangue della sua croce sia le cose che stanno sulla terra, sia quelle che stanno nei cieli. Un tempo anche voi eravate stranieri e nemici, con la mente intenta alle opere cattive; ora egli vi ha riconciliati nel corpo della sua carne mediante la morte, per presentarvi santi, immacolati e irreprensibili dinanzi a lui;"],["Colossesi 1,27","A loro Dio volle far conoscere la gloriosa ricchezza di questo mistero in mezzo alle genti: Cristo in voi, speranza della gloria."],["Colossesi 1,4-5","avendo avuto notizie della vostra fede in Cristo Gesù e della carità che avete verso tutti i santi a causa della speranza che vi attende nei cieli. Ne avete già udito l'annuncio dalla parola di verità del Vangelo"],["Colossesi 2,14","annullando il documento scritto contro di noi che, con le prescrizioni, ci era contrario: lo ha tolto di mezzo inchiodandolo alla croce."],["Colossesi 2,16","Nessuno dunque vi condanni in fatto di cibo o di bevanda, o per feste, noviluni e sabati:"],["Colossesi 2,8","Fate attenzione che nessuno faccia di voi sua preda con la filosofia e con vuoti raggiri ispirati alla tradizione umana, secondo gli elementi del mondo e non secondo Cristo."],["Colossesi 3,1","Se dunque siete risorti con Cristo, cercate le cose di lassù, dove è Cristo, seduto alla destra di Dio;"],["Colossesi 3,10","e avete rivestito il nuovo, che si rinnova per una piena conoscenza, ad immagine di Colui che lo ha creato."],["Colossesi 3,11","Qui non vi è Greco o Giudeo, circoncisione o incirconcisione, barbaro, Scita, schiavo, libero, ma Cristo è tutto e in tutti."],["Colossesi 3,12-14","Scelti da Dio, santi e amati, rivestitevi dunque di sentimenti di tenerezza, di bontà, di umiltà, di mansuetudine, di magnanimità, sopportandovi a vicenda e perdonandovi gli uni gli altri, se qualcuno avesse di che lamentarsi nei riguardi di un altro. Come il Signore vi ha perdonato, così fate anche voi. Ma sopra tutte queste cose rivestitevi della carità, che le unisce in modo perfetto."],["Colossesi 3,15","E la pace di Cristo regni nei vostri cuori, perché ad essa siete stati chiamati in un solo corpo. E rendete grazie!"],["Colossesi 3,16","La parola di Cristo abiti tra voi nella sua ricchezza. Con ogni sapienza istruitevi e ammonitevi a vicenda con salmi, inni e canti ispirati, con gratitudine, cantando a Dio nei vostri cuori."],["Colossesi 3,17","E qualunque cosa facciate, in parole e in opere, tutto avvenga nel nome del Signore Gesù, rendendo grazie per mezzo di lui a Dio Padre."],["Colossesi 3,2","rivolgete il pensiero alle cose di lassù, non a quelle della terra."],["Colossesi 3,23-25","Qualunque cosa facciate, fatela di buon animo, come per il Signore e non per gli uomini, sapendo che dal Signore riceverete come ricompensa l'eredità. Servite il Signore che è Cristo! Infatti chi commette ingiustizia subirà le conseguenze del torto commesso, e non si fanno favoritismi personali."],["Colossesi 3,9","Non dite menzogne gli uni agli altri: vi siete svestiti dell'uomo vecchio con le sue azioni"],["Colossesi 4,2","Perseverate nella preghiera e vegliate in essa, rendendo grazie."],["Colossesi 4,6","Il vostro parlare sia sempre gentile, sensato, in modo da saper rispondere a ciascuno come si deve."],["Deuteronomio 10,12","Ora, Israele, che cosa ti chiede il Signore, tuo Dio, se non che tu tema il Signore, tuo Dio, che tu cammini per tutte le sue vie, che tu lo ami, che tu serva il Signore, tuo Dio, con tutto il cuore e con tutta l'anima,"],["Deuteronomio 13,3","e il segno e il prodigio annunciato succeda, ed egli ti dica: «Seguiamo dèi stranieri, che tu non hai mai conosciuto, e serviamoli»,"],["Deuteronomio 13,4","tu non dovrai ascoltare le parole di quel profeta o di quel sognatore, perché il Signore, vostro Dio, vi mette alla prova per sapere se amate il Signore, vostro Dio, con tutto il cuore e con tutta l'anima."],["Deuteronomio 15,11","Poiché i bisognosi non mancheranno mai nella terra, allora io ti do questo comando e ti dico: «Apri generosamente la mano al tuo fratello povero e bisognoso nella tua terra»."],["Deuteronomio 15,7-8","Se vi sarà in mezzo a te qualche tuo fratello che sia bisognoso in una delle tue città nella terra che il Signore, tuo Dio, ti dà, non indurirai il tuo cuore e non chiuderai la mano davanti al tuo fratello bisognoso, ma gli aprirai la mano e gli presterai quanto occorre alla necessità in cui si trova."],["Deuteronomio 28,1-3","Se tu obbedirai fedelmente alla voce del Signore, tuo Dio, preoccupandoti di mettere in pratica tutti i suoi comandi che io ti prescrivo, il Signore, tuo Dio, ti metterà al di sopra di tutte le nazioni della terra. Poiché tu avrai ascoltato la voce del Signore, tuo Dio, verranno su di te e ti raggiungeranno tutte queste benedizioni. Sarai benedetto nella città e benedetto nella campagna."],["Deuteronomio 30,19-20","Prendo oggi a testimoni contro di voi il cielo e la terra: io ti ho posto davanti la vita e la morte, la benedizione e la maledizione. Scegli dunque la vita, perché viva tu e la tua discendenza, amando il Signore, tuo Dio, obbedendo alla sua voce e tenendoti unito a lui, poiché è lui la tua vita e la tua longevità, per poter così abitare nel paese che il Signore ha giurato di dare ai tuoi padri, Abramo, Isacco e Giacobbe»."],["Deuteronomio 31,6","Siate forti, fatevi animo, non temete e non vi spaventate di loro, perché il Signore, tuo Dio, cammina con te; non ti lascerà e non ti abbandonerà»."],["Deuteronomio 31,8","Il Signore stesso cammina davanti a te. Egli sarà con te, non ti lascerà e non ti abbandonerà. Non temere e non perderti d'animo!»."],["Deuteronomio 4,31","poiché il Signore, tuo Dio, è un Dio misericordioso, non ti abbandonerà e non ti distruggerà, non dimenticherà l'alleanza che ha giurato ai tuoi padri."],["Deuteronomio 6,5","Tu amerai il Signore, tuo Dio, con tutto il cuore, con tutta l'anima e con tutte le forze."],["Deuteronomio 7,9","Riconosci dunque il Signore, tuo Dio: egli è Dio, il Dio fedele, che mantiene l'alleanza e la bontà per mille generazioni con coloro che lo amano e osservano i suoi comandamenti,"],["Ebrei 1,3","Egli è irradiazione della sua gloria e impronta della sua sostanza, e tutto sostiene con la sua parola potente. Dopo aver compiuto la purificazione dei peccati, sedette alla destra della maestà nell'alto dei cieli,"],["Ebrei 10,14","Infatti, con un'unica offerta egli ha reso perfetti per sempre quelli che vengono santificati."],["Ebrei 10,17","e non mi ricorderò più dei loro peccati e delle loro iniquità."],["Ebrei 10,23","Manteniamo senza vacillare la professione della nostra speranza, perché è degno di fede colui che ha promesso."],["Ebrei 10,24","Prestiamo attenzione gli uni agli altri, per stimolarci a vicenda nella carità e nelle opere buone."],["Ebrei 10,25","Non disertiamo le nostre riunioni, come alcuni hanno l'abitudine di fare, ma esortiamoci a vicenda, tanto più che vedete avvicinarsi il giorno del Signore."],["Ebrei 10,36","Avete solo bisogno di perseveranza, perché, fatta la volontà di Dio, otteniate ciò che vi è stato promesso."],["Ebrei 10,38","Il mio giusto per fede vivrà; ma se cede, non porrò in lui il mio amore ."],["Ebrei 11,1","La fede è fondamento di ciò che si spera e prova di ciò che non si vede."],["Ebrei 11,11","Per fede, anche Sara, sebbene fuori dell'età, ricevette la possibilità di diventare madre, perché ritenne degno di fede colui che glielo aveva promesso."],["Ebrei 11,3","Per fede, noi sappiamo che i mondi furono formati dalla parola di Dio, sicché dall'invisibile ha preso origine il mondo visibile."],["Ebrei 11,6","Senza la fede è impossibile essergli graditi; chi infatti si avvicina a Dio, deve credere che egli esiste e che ricompensa coloro che lo cercano."],["Ebrei 12,1-2","Anche noi dunque, circondati da tale moltitudine di testimoni, avendo deposto tutto ciò che è di peso e il peccato che ci assedia, corriamo con perseveranza nella corsa che ci sta davanti, tenendo fisso lo sguardo su Gesù, colui che dà origine alla fede e la porta a compimento. Egli, di fronte alla gioia che gli era posta dinanzi, si sottopose alla croce, disprezzando il disonore, e siede alla destra del trono di Dio."],["Ebrei 12,14","Cercate la pace con tutti e la santificazione, senza la quale nessuno vedrà mai il Signore;"],["Ebrei 12,28","Perciò noi, che possediamo un regno incrollabile, conserviamo questa grazia, mediante la quale rendiamo culto in maniera gradita a Dio con riverenza e timore;"],["Ebrei 12,3","Pensate attentamente a colui che ha sopportato contro di sé una così grande ostilità dei peccatori, perché non vi stanchiate perdendovi d'animo."],["Ebrei 12,5-6","e avete già dimenticato l'esortazione a voi rivolta come a figli: Figlio mio, non disprezzare la correzione del Signore e non ti perdere d'animo quando sei ripreso da lui; perché il Signore corregge colui che egli ama e percuote chiunque riconosce come figlio ."],["Ebrei 13,1","L'amore fraterno resti saldo."],["Ebrei 13,15","Per mezzo di lui dunque offriamo a Dio continuamente un sacrificio di lode, cioè il frutto di labbra che confessano il suo nome."],["Ebrei 13,16","Non dimenticatevi della beneficenza e della comunione dei beni, perché di tali sacrifici il Signore si compiace."],["Ebrei 13,17","Obbedite ai vostri capi e state loro sottomessi, perché essi vegliano su di voi e devono renderne conto, affinché lo facciano con gioia e non lamentandosi. Ciò non sarebbe di vantaggio per voi."],["Ebrei 13,18","Pregate per noi; crediamo infatti di avere una buona coscienza, desiderando di comportarci bene in tutto."],["Ebrei 13,2","Non dimenticate l'ospitalità; alcuni, praticandola, senza saperlo hanno accolto degli angeli."],["Ebrei 13,20-21","Il Dio della pace, che ha ricondotto dai morti il Pastore grande delle pecore, in virtù del sangue di un'alleanza eterna, il Signore nostro Gesù, vi renda perfetti in ogni bene, perché possiate compiere la sua volontà, operando in voi ciò che a lui è gradito per mezzo di Gesù Cristo, al quale sia gloria nei secoli dei secoli. Amen."],["Ebrei 13,5","La vostra condotta sia senza avarizia; accontentatevi di quello che avete, perché Dio stesso ha detto: Non ti lascerò e non ti abbandonerò ."],["Ebrei 13,6","Così possiamo dire con fiducia: Il Signore è il mio aiuto, non avrò paura. Che cosa può farmi l'uomo?"],["Ebrei 13,8","Gesù Cristo è lo stesso ieri e oggi e per sempre!"],["Ebrei 3,1","Perciò, fratelli santi, voi che siete partecipi di una vocazione celeste, prestate attenzione a Gesù, l'apostolo e sommo sacerdote della fede che noi professiamo,"],["Ebrei 3,13","Esortatevi piuttosto a vicenda ogni giorno, finché dura questo oggi, perché nessuno di voi si ostini, sedotto dal peccato."],["Ebrei 3,19","E noi vediamo che non poterono entrarvi a causa della loro mancanza di fede."],["Ebrei 4,1","Dovremmo dunque avere il timore che, mentre rimane ancora in vigore la promessa di entrare nel suo riposo, qualcuno di voi ne sia giudicato escluso."],["Ebrei 4,12","Infatti la parola di Dio è viva, efficace e più tagliente di ogni spada a doppio taglio; essa penetra fino al punto di divisione dell'anima e dello spirito, fino alle giunture e alle midolla, e discerne i sentimenti e i pensieri del cuore."],["Ebrei 4,15","Infatti non abbiamo un sommo sacerdote che non sappia prendere parte alle nostre debolezze: egli stesso è stato messo alla prova in ogni cosa come noi, escluso il peccato."],["Ebrei 4,16","Accostiamoci dunque con piena fiducia al trono della grazia per ricevere misericordia e trovare grazia, così da essere aiutati al momento opportuno."],["Ebrei 4,8","Se Giosuè infatti li avesse introdotti in quel riposo, Dio non avrebbe parlato, in seguito, di un altro giorno."],["Ebrei 4,9-11","Dunque, per il popolo di Dio è riservato un riposo sabbatico. Chi infatti è entrato nel riposo di lui, riposa anch'egli dalle sue opere, come Dio dalle proprie. Affrettiamoci dunque a entrare in quel riposo, perché nessuno cada nello stesso tipo di disobbedienza."],["Ebrei 6,10","Dio infatti non è ingiusto tanto da dimenticare il vostro lavoro e la carità che avete dimostrato verso il suo nome, con i servizi che avete reso e che tuttora rendete ai santi."],["Ebrei 8,12","Perché io perdonerò le loro iniquità e non mi ricorderò più dei loro peccati ."],["Efesini 1,11","In lui siamo stati fatti anche eredi, predestinati - secondo il progetto di colui che tutto opera secondo la sua volontà -"],["Efesini 1,13","In lui anche voi, dopo avere ascoltato la parola della verità, il Vangelo della vostra salvezza, e avere in esso creduto, avete ricevuto il sigillo dello Spirito Santo che era stato promesso,"],["Efesini 1,16","continuamente rendo grazie per voi ricordandovi nelle mie preghiere,"],["Efesini 1,17","affinché il Dio del Signore nostro Gesù Cristo, il Padre della gloria, vi dia uno spirito di sapienza e di rivelazione per una profonda conoscenza di lui;"],["Efesini 1,3","Benedetto Dio, Padre del Signore nostro Gesù Cristo, che ci ha benedetti con ogni benedizione spirituale nei cieli in Cristo."],["Efesini 1,7","In lui, mediante il suo sangue, abbiamo la redenzione, il perdono delle colpe, secondo la ricchezza della sua grazia."],["Efesini 2,10","Siamo infatti opera sua, creati in Cristo Gesù per le opere buone, che Dio ha preparato perché in esse camminassimo."],["Efesini 2,14","Egli infatti è la nostra pace, colui che di due ha fatto una cosa sola, abbattendo il muro di separazione che li divideva, cioè l'inimicizia, per mezzo della sua carne."],["Efesini 2,4-5","Ma Dio, ricco di misericordia, per il grande amore con il quale ci ha amato, da morti che eravamo per le colpe, ci ha fatto rivivere con Cristo: per grazia siete salvati."],["Efesini 2,8-9","Per grazia infatti siete salvati mediante la fede; e ciò non viene da voi, ma è dono di Dio; né viene dalle opere, perché nessuno possa vantarsene."],["Efesini 3,12","nel quale abbiamo la libertà di accedere a Dio in piena fiducia mediante la fede in lui."],["Efesini 3,14-15","Per questo io piego le ginocchia davanti al Padre, dal quale ha origine ogni discendenza in cielo e sulla terra,"],["Efesini 3,17-19","Che il Cristo abiti per mezzo della fede nei vostri cuori, e così, radicati e fondati nella carità, siate in grado di comprendere con tutti i santi quale sia l'ampiezza, la lunghezza, l'altezza e la profondità, e di conoscere l'amore di Cristo che supera ogni conoscenza, perché siate ricolmi di tutta la pienezza di Dio."],["Efesini 4,1","Io dunque, prigioniero a motivo del Signore, vi esorto: comportatevi in maniera degna della chiamata che avete ricevuto,"],["Efesini 4,13","finché arriviamo tutti all'unità della fede e della conoscenza del Figlio di Dio, fino all'uomo perfetto, fino a raggiungere la misura della pienezza di Cristo."],["Efesini 4,15","Al contrario, agendo secondo verità nella carità, cerchiamo di crescere in ogni cosa tendendo a lui, che è il capo, Cristo."],["Efesini 4,2","con ogni umiltà, dolcezza e magnanimità, sopportandovi a vicenda nell'amore,"],["Efesini 4,22-24","ad abbandonare, con la sua condotta di prima, l'uomo vecchio che si corrompe seguendo le passioni ingannevoli, a rinnovarvi nello spirito della vostra mente e a rivestire l'uomo nuovo, creato secondo Dio nella giustizia e nella vera santità."],["Efesini 4,25","Perciò, bando alla menzogna e dite ciascuno la verità al suo prossimo, perché siamo membra gli uni degli altri."],["Efesini 4,29","Nessuna parola cattiva esca dalla vostra bocca, ma piuttosto parole buone che possano servire per un'opportuna edificazione, giovando a quelli che ascoltano."],["Efesini 4,3","avendo a cuore di conservare l'unità dello spirito per mezzo del vincolo della pace."],["Efesini 4,32","Siate invece benevoli gli uni verso gli altri, misericordiosi, perdonandovi a vicenda come Dio ha perdonato a voi in Cristo."],["Efesini 4,4","Un solo corpo e un solo spirito, come una sola è la speranza alla quale siete stati chiamati, quella della vostra vocazione;"],["Efesini 5,1","Fatevi dunque imitatori di Dio, quali figli carissimi,"],["Efesini 5,15","Fate dunque molta attenzione al vostro modo di vivere, comportandovi non da stolti ma da saggi,"],["Efesini 5,19","intrattenendovi fra voi con salmi, inni, canti ispirati, cantando e inneggiando al Signore con il vostro cuore,"],["Efesini 5,2","e camminate nella carità, nel modo in cui anche Cristo ci ha amato e ha dato se stesso per noi, offrendosi a Dio in sacrificio di soave odore."],["Efesini 5,20","rendendo continuamente grazie per ogni cosa a Dio Padre, nel nome del Signore nostro Gesù Cristo."],["Efesini 5,21","Nel timore di Cristo, siate sottomessi gli uni agli altri:"],["Efesini 5,8","Un tempo infatti eravate tenebra, ora siete luce nel Signore. Comportatevi perciò come figli della luce;"],["Efesini 6,10","Per il resto, rafforzatevi nel Signore e nel vigore della sua potenza."],["Efesini 6,11","Indossate l'armatura di Dio per poter resistere alle insidie del diavolo."],["Efesini 6,13","Prendete dunque l'armatura di Dio, perché possiate resistere nel giorno cattivo e restare saldi dopo aver superato tutte le prove."],["Efesini 6,14","State saldi, dunque: attorno ai fianchi, la verità; indosso, la corazza della giustizia;"],["Efesini 6,16","Afferrate sempre lo scudo della fede, con il quale potrete spegnere tutte le frecce infuocate del Maligno;"],["Efesini 6,18","In ogni occasione, pregate con ogni sorta di preghiere e di suppliche nello Spirito, e a questo scopo vegliate con ogni perseveranza e supplica per tutti i santi."],["Efesini 6,19","E pregate anche per me, affinché, quando apro la bocca, mi sia data la parola, per far conoscere con franchezza il mistero del Vangelo,"],["Efesini 6,23","Ai fratelli pace e carità con fede da parte di Dio Padre e del Signore Gesù Cristo."],["Efesini 6,4","E voi, padri, non esasperate i vostri figli, ma fateli crescere nella disciplina e negli insegnamenti del Signore."],["Efesini 6,7","prestando servizio volentieri, come chi serve il Signore e non gli uomini."],["Esodo 14,14","Il Signore combatterà per voi, e voi starete tranquilli»."],["Esodo 15,2","Mia forza e mio canto è il Signore, egli è stato la mia salvezza. È il mio Dio: lo voglio lodare, il Dio di mio padre: lo voglio esaltare!"],["Esodo 15,26","Disse: «Se tu darai ascolto alla voce del Signore, tuo Dio, e farai ciò che è retto ai suoi occhi, se tu presterai orecchio ai suoi ordini e osserverai tutte le sue leggi, io non t'infliggerò nessuna delle infermità che ho inflitto agli Egiziani, perché io sono il Signore, colui che ti guarisce!»."],["Esodo 20,12","Onora tuo padre e tua madre, perché si prolunghino i tuoi giorni nel paese che il Signore, tuo Dio, ti dà."],["Esodo 3,12","Rispose: «Io sarò con te. Questo sarà per te il segno che io ti ho mandato: quando tu avrai fatto uscire il popolo dall'Egitto, servirete Dio su questo monte»."],["Esodo 33,14","Rispose: «Il mio volto camminerà con voi e ti darò riposo»."],["Esodo 33,18","Gli disse: «Mostrami la tua gloria!»."],["Esodo 9,16","invece per questo ti ho lasciato sussistere, per dimostrarti la mia potenza e per divulgare il mio nome in tutta la terra."],["Filemone 1,8","Per questo, pur avendo in Cristo piena libertà di ordinarti ciò che è opportuno,"],["Filippesi 1,2","grazia a voi e pace da Dio, Padre nostro, e dal Signore Gesù Cristo."],["Filippesi 1,20","secondo la mia ardente attesa e la speranza che in nulla rimarrò deluso; anzi nella piena fiducia che, come sempre, anche ora Cristo sarà glorificato nel mio corpo, sia che io viva sia che io muoia."],["Filippesi 1,27","Comportatevi dunque in modo degno del vangelo di Cristo perché, sia che io venga e vi veda, sia che io rimanga lontano, abbia notizie di voi: che state saldi in un solo spirito e che combattete unanimi per la fede del Vangelo,"],["Filippesi 1,6","Sono persuaso che colui il quale ha iniziato in voi quest'opera buona, la porterà a compimento fino al giorno di Cristo Gesù."],["Filippesi 1,7","È giusto, del resto, che io provi questi sentimenti per tutti voi, perché vi porto nel cuore, sia quando sono in prigionia, sia quando difendo e confermo il Vangelo, voi che con me siete tutti partecipi della grazia."],["Filippesi 2,13","È Dio infatti che suscita in voi il volere e l'operare secondo il suo disegno d'amore."],["Filippesi 2,15-16","per essere irreprensibili e puri, figli di Dio innocenti in mezzo a una generazione malvagia e perversa. In mezzo a loro voi risplendete come astri nel mondo, tenendo salda la parola di vita. Così nel giorno di Cristo io potrò vantarmi di non aver corso invano, né invano aver faticato."],["Filippesi 2,2","rendete piena la mia gioia con un medesimo sentire e con la stessa carità, rimanendo unanimi e concordi."],["Filippesi 2,3-4","Non fate nulla per rivalità o vanagloria, ma ciascuno di voi, con tutta umiltà, consideri gli altri superiori a se stesso. Ciascuno non cerchi l'interesse proprio, ma anche quello degli altri."],["Filippesi 2,5","Abbiate in voi gli stessi sentimenti di Cristo Gesù:"],["Filippesi 2,9-11","Per questo Dio lo esaltò e gli donò il nome che è al di sopra di ogni nome, perché nel nome di Gesù ogni ginocchio si pieghi nei cieli, sulla terra e sotto terra, e ogni lingua proclami: «Gesù Cristo è Signore! , a gloria di Dio Padre."],["Filippesi 3,14","corro verso la mèta, al premio che Dio ci chiama a ricevere lassù, in Cristo Gesù."],["Filippesi 4,13","Tutto posso in colui che mi dà la forza."],["Filippesi 4,19","Il mio Dio, a sua volta, colmerà ogni vostro bisogno secondo la sua ricchezza con magnificenza, in Cristo Gesù."],["Filippesi 4,4","Siate sempre lieti nel Signore, ve lo ripeto: siate lieti."],["Filippesi 4,5","La vostra amabilità sia nota a tutti. Il Signore è vicino!"],["Filippesi 4,6-7","Non angustiatevi per nulla, ma in ogni circostanza fate presenti a Dio le vostre richieste con preghiere, suppliche e ringraziamenti. E la pace di Dio, che supera ogni intelligenza, custodirà i vostri cuori e le vostre menti in Cristo Gesù."],["Filippesi 4,8","In conclusione, fratelli, quello che è vero, quello che è nobile, quello che è giusto, quello che è puro, quello che è amabile, quello che è onorato, ciò che è virtù e ciò che merita lode, questo sia oggetto dei vostri pensieri."],["Galati 1,15","Ma quando Dio, che mi scelse fin dal seno di mia madre e mi chiamò con la sua grazia, si compiacque"],["Galati 2,20","e non vivo più io, ma Cristo vive in me. E questa vita, che io vivo nel corpo, la vivo nella fede del Figlio di Dio, che mi ha amato e ha consegnato se stesso per me."],["Galati 3,28","Non c'è Giudeo né Greco; non c'è schiavo né libero; non c'è maschio e femmina, perché tutti voi siete uno in Cristo Gesù."],["Galati 5,1","Cristo ci ha liberati per la libertà! State dunque saldi e non lasciatevi imporre di nuovo il giogo della schiavitù."],["Galati 5,13","Voi infatti, fratelli, siete stati chiamati a libertà. Che questa libertà non divenga però un pretesto per la carne; mediante l'amore siate invece a servizio gli uni degli altri."],["Galati 5,14","Tutta la Legge infatti trova la sua pienezza in un solo precetto: Amerai il tuo prossimo come te stesso ."],["Galati 5,22-23","Il frutto dello Spirito invece è amore, gioia, pace, magnanimità, benevolenza, bontà, fedeltà, mitezza, dominio di sé; contro queste cose non c'è Legge."],["Galati 5,25","Perciò se viviamo dello Spirito, camminiamo anche secondo lo Spirito."],["Galati 5,6","Perché in Cristo Gesù non è la circoncisione che vale o la non circoncisione, ma la fede che si rende operosa per mezzo della carità."],["Galati 6,1","Fratelli, se uno viene sorpreso in qualche colpa, voi, che avete lo Spirito, correggetelo con spirito di dolcezza. E tu vigila su te stesso, per non essere tentato anche tu."],["Galati 6,10","Poiché dunque ne abbiamo l'occasione, operiamo il bene verso tutti, soprattutto verso i fratelli nella fede."],["Galati 6,15","Non è infatti la circoncisione che conta, né la non circoncisione, ma l'essere nuova creatura."],["Galati 6,2","Portate i pesi gli uni degli altri: così adempirete la legge di Cristo."],["Galati 6,7-8","Non fatevi illusioni: Dio non si lascia ingannare. Ciascuno raccoglierà quello che avrà seminato. Chi semina nella sua carne, dalla carne raccoglierà corruzione; chi semina nello Spirito, dallo Spirito raccoglierà vita eterna."],["Galati 6,9","E non stanchiamoci di fare il bene; se infatti non desistiamo, a suo tempo mieteremo."],["Genesi 1,1","In principio Dio creò il cielo e la terra."],["Genesi 1,26","Dio disse: «Facciamo l'uomo a nostra immagine, secondo la nostra somiglianza: dòmini sui pesci del mare e sugli uccelli del cielo, sul bestiame, su tutti gli animali selvatici e su tutti i rettili che strisciano sulla terra»."],["Genesi 1,27","E Dio creò l'uomo a sua immagine; a immagine di Dio lo creò: maschio e femmina li creò."],["Genesi 1,3","Dio disse: «Sia la luce!». E la luce fu."],["Genesi 1,31","Dio vide quanto aveva fatto, ed ecco, era cosa molto buona. E fu sera e fu mattina: sesto giorno."],["Genesi 2,18","E il Signore Dio disse: «Non è bene che l'uomo sia solo: voglio fargli un aiuto che gli corrisponda»."],["Genesi 2,2","Dio, nel settimo giorno, portò a compimento il lavoro che aveva fatto e cessò nel settimo giorno da ogni suo lavoro che aveva fatto."],["Genesi 2,24","Per questo l'uomo lascerà suo padre e sua madre e si unirà a sua moglie, e i due saranno un'unica carne."],["Genesi 33,5","Alzàti gli occhi, vide le donne e i bambini e domandò: «Chi sono questi con te?». Giacobbe rispose: «Sono i bambini che Dio si è compiaciuto di dare al tuo servo»."],["Geremia 1,5","«Prima di formarti nel grembo materno, ti ho conosciuto, prima che tu uscissi alla luce, ti ho consacrato; ti ho stabilito profeta delle nazioni»."],["Geremia 1,7-8","Ma il Signore mi disse: «Non dire: «Sono giovane». Tu andrai da tutti coloro a cui ti manderò e dirai tutto quello che io ti ordinerò. Non aver paura di fronte a loro, perché io sono con te per proteggerti». Oracolo del Signore."],["Geremia 17,14","Guariscimi, Signore, e guarirò, salvami e sarò salvato, poiché tu sei il mio vanto."],["Geremia 17,7","Benedetto l'uomo che confida nel Signore e il Signore è la sua fiducia."],["Geremia 29,11","Io conosco i progetti che ho fatto a vostro riguardo - oracolo del Signore -, progetti di pace e non di sventura, per concedervi un futuro pieno di speranza."],["Geremia 29,12","Voi mi invocherete e ricorrerete a me e io vi esaudirò."],["Geremia 29,13","Mi cercherete e mi troverete, perché mi cercherete con tutto il cuore;"],["Geremia 30,17","Curerò infatti la tua ferita e ti guarirò dalle tue piaghe - oracolo del Signore -, poiché ti chiamano la ripudiata, o Sion, quella che nessuno ricerca."],["Geremia 31,3","Da lontano mi è apparso il Signore: «Ti ho amato di amore eterno, per questo continuo a esserti fedele."],["Geremia 33,3","Invocami, e io ti risponderò e ti annuncerò cose grandi e impenetrabili, che non conosci."],["Geremia 33,6","Ma ecco, io farò rimarginare la loro piaga, li curerò e li risanerò; procurerò loro abbondanza di pace e di sicurezza."],["Geremia 6,16","Così dice il Signore: «Fermatevi nelle strade e guardate, informatevi dei sentieri del passato, dove sta la strada buona percorretela, così troverete pace per la vostra vita». Ma essi hanno risposto: «Non la prenderemo!»."],["Giacomo 1,12","Beato l'uomo che resiste alla tentazione perché, dopo averla superata, riceverà la corona della vita, che il Signore ha promesso a quelli che lo amano."],["Giacomo 1,17","ogni buon regalo e ogni dono perfetto vengono dall'alto e discendono dal Padre, creatore della luce: presso di lui non c'è variazione né ombra di cambiamento."],["Giacomo 1,18","Per sua volontà egli ci ha generati per mezzo della parola di verità, per essere una primizia delle sue creature."],["Giacomo 1,19-21","Lo sapete, fratelli miei carissimi: ognuno sia pronto ad ascoltare, lento a parlare e lento all'ira. Infatti l'ira dell'uomo non compie ciò che è giusto davanti a Dio. Perciò liberatevi da ogni impurità e da ogni eccesso di malizia, accogliete con docilità la Parola che è stata piantata in voi e può portarvi alla salvezza."],["Giacomo 1,2-4","Considerate perfetta letizia, miei fratelli, quando subite ogni sorta di prove, sapendo che la vostra fede, messa alla prova, produce pazienza. E la pazienza completi l'opera sua in voi, perché siate perfetti e integri, senza mancare di nulla."],["Giacomo 1,22","Siate di quelli che mettono in pratica la Parola, e non ascoltatori soltanto, illudendo voi stessi;"],["Giacomo 1,25","Chi invece fissa lo sguardo sulla legge perfetta, la legge della libertà, e le resta fedele, non come un ascoltatore smemorato ma come uno che la mette in pratica, questi troverà la sua felicità nel praticarla."],["Giacomo 1,27","Religione pura e senza macchia davanti a Dio Padre è questa: visitare gli orfani e le vedove nelle sofferenze e non lasciarsi contaminare da questo mondo."],["Giacomo 1,5","Se qualcuno di voi è privo di sapienza, la domandi a Dio, che dona a tutti con semplicità e senza condizioni, e gli sarà data."],["Giacomo 2,18","Al contrario uno potrebbe dire: «Tu hai la fede e io ho le opere; mostrami la tua fede senza le opere, e io con le mie opere ti mostrerò la mia fede»."],["Giacomo 2,23","E si compì la Scrittura che dice: Abramo credette a Dio e gli fu accreditato come giustizia , ed egli fu chiamato amico di Dio."],["Giacomo 2,24","Vedete: l'uomo è giustificato per le opere e non soltanto per la fede."],["Giacomo 2,5","Ascoltate, fratelli miei carissimi: Dio non ha forse scelto i poveri agli occhi del mondo, che sono ricchi nella fede ed eredi del Regno, promesso a quelli che lo amano?"],["Giacomo 2,8","Certo, se adempite quella che, secondo la Scrittura, è la legge regale: Amerai il prossimo tuo come te stesso , fate bene."],["Giacomo 3,13-14","Chi tra voi è saggio e intelligente? Con la buona condotta mostri che le sue opere sono ispirate a mitezza e sapienza. Ma se avete nel vostro cuore gelosia amara e spirito di contesa, non vantatevi e non dite menzogne contro la verità."],["Giacomo 3,17","Invece la sapienza che viene dall'alto anzitutto è pura, poi pacifica, mite, arrendevole, piena di misericordia e di buoni frutti, imparziale e sincera."],["Giacomo 3,18","Per coloro che fanno opera di pace viene seminato nella pace un frutto di giustizia."],["Giacomo 4,10","Umiliatevi davanti al Signore ed egli vi esalterà."],["Giacomo 4,13-15","E ora a voi, che dite: «Oggi o domani andremo nella tal città e vi passeremo un anno e faremo affari e guadagni», mentre non sapete quale sarà domani la vostra vita! Siete come vapore che appare per un istante e poi scompare. Dovreste dire invece: «Se il Signore vorrà, vivremo e faremo questo o quello»."],["Giacomo 4,6","Anzi, ci concede la grazia più grande; per questo dice: Dio resiste ai superbi, agli umili invece dà la sua grazia ."],["Giacomo 4,7","Sottomettetevi dunque a Dio; resistete al diavolo, ed egli fuggirà lontano da voi."],["Giacomo 5,11","Ecco, noi chiamiamo beati quelli che sono stati pazienti. Avete udito parlare della pazienza di Giobbe e conoscete la sorte finale che gli riserbò il Signore, perché il Signore è ricco di misericordia e di compassione."],["Giacomo 5,13","Chi tra voi è nel dolore, preghi; chi è nella gioia, canti inni di lode."],["Giacomo 5,14","Chi è malato, chiami presso di sé i presbìteri della Chiesa ed essi preghino su di lui, ungendolo con olio nel nome del Signore."],["Giacomo 5,15","E la preghiera fatta con fede salverà il malato: il Signore lo solleverà e, se ha commesso peccati, gli saranno perdonati."],["Giacomo 5,16","Confessate perciò i vostri peccati gli uni agli altri e pregate gli uni per gli altri per essere guariti. Molto potente è la preghiera fervorosa del giusto."],["Giacomo 5,18","Poi pregò di nuovo e il cielo diede la pioggia e la terra produsse il suo frutto."],["Giosuè 1,6","Sii coraggioso e forte, poiché tu dovrai assegnare a questo popolo la terra che ho giurato ai loro padri di dare loro."],["Giosuè 1,9","Non ti ho forse comandato: «Sii forte e coraggioso»? Non aver paura e non spaventarti, perché il Signore, tuo Dio, è con te, dovunque tu vada»."],["Giosuè 22,5","Tuttavia abbiate gran cura di eseguire il comandamento e la legge che Mosè, servo del Signore, vi ha dato: amare il Signore, vostro Dio, camminare in tutte le sue vie, osservare i suoi comandamenti, aderire a lui e servirlo con tutto il vostro cuore e con tutta la vostra anima»."],["Giosuè 24,15","Se sembra male ai vostri occhi servire il Signore, sceglietevi oggi chi servire: se gli dèi che i vostri padri hanno servito oltre il Fiume oppure gli dèi degli Amorrei, nel cui territorio abitate. Quanto a me e alla mia casa, serviremo il Signore»."],["Giovanni 1,12","A quanti però lo hanno accolto ha dato potere di diventare figli di Dio: a quelli che credono nel suo nome,"],["Giovanni 1,14","E il Verbo si fece carne e venne ad abitare in mezzo a noi; e noi abbiamo contemplato la sua gloria, gloria come del Figlio unigenito che viene dal Padre, pieno di grazia e di verità."],["Giovanni 1,16","Dalla sua pienezza noi tutti abbiamo ricevuto: grazia su grazia."],["Giovanni 1,3","tutto è stato fatto per mezzo di lui e senza di lui nulla è stato fatto di ciò che esiste."],["Giovanni 1,5","la luce splende nelle tenebre e le tenebre non l'hanno vinta."],["Giovanni 10,10","Il ladro non viene se non per rubare, uccidere e distruggere; io sono venuto perché abbiano la vita e l'abbiano in abbondanza."],["Giovanni 10,11","Io sono il buon pastore. Il buon pastore dà la propria vita per le pecore."],["Giovanni 10,14","Io sono il buon pastore, conosco le mie pecore e le mie pecore conoscono me,"],["Giovanni 10,28-29","Io do loro la vita eterna e non andranno perdute in eterno e nessuno le strapperà dalla mia mano. Il Padre mio, che me le ha date, è più grande di tutti e nessuno può strapparle dalla mano del Padre."],["Giovanni 10,35","Ora, se essa ha chiamato dèi coloro ai quali fu rivolta la parola di Dio - e la Scrittura non può essere annullata -,"],["Giovanni 10,9","Io sono la porta: se uno entra attraverso di me, sarà salvato; entrerà e uscirà e troverà pascolo."],["Giovanni 11,4","All'udire questo, Gesù disse: «Questa malattia non porterà alla morte, ma è per la gloria di Dio, affinché per mezzo di essa il Figlio di Dio venga glorificato»."],["Giovanni 11,40","Le disse Gesù: «Non ti ho detto che, se crederai, vedrai la gloria di Dio?»."],["Giovanni 12,26","Se uno mi vuole servire, mi segua, e dove sono io, là sarà anche il mio servitore. Se uno serve me, il Padre lo onorerà."],["Giovanni 13,1","Prima della festa di Pasqua Gesù, sapendo che era venuta la sua ora di passare da questo mondo al Padre, avendo amato i suoi che erano nel mondo, li amò fino alla fine."],["Giovanni 13,12-14","Quando ebbe lavato loro i piedi, riprese le sue vesti, sedette di nuovo e disse loro: «Capite quello che ho fatto per voi? Voi mi chiamate il Maestro e il Signore, e dite bene, perché lo sono. Se dunque io, il Signore e il Maestro, ho lavato i piedi a voi, anche voi dovete lavare i piedi gli uni agli altri."],["Giovanni 13,34","Vi do un comandamento nuovo: che vi amiate gli uni gli altri. Come io ho amato voi, così amatevi anche voi gli uni gli altri."],["Giovanni 13,35","Da questo tutti sapranno che siete miei discepoli: se avete amore gli uni per gli altri»."],["Giovanni 14,1","Non sia turbato il vostro cuore. Abbiate fede in Dio e abbiate fede anche in me."],["Giovanni 14,12","In verità, in verità io vi dico: chi crede in me, anch'egli compirà le opere che io compio e ne compirà di più grandi di queste, perché io vado al Padre."],["Giovanni 14,13","E qualunque cosa chiederete nel mio nome, la farò, perché il Padre sia glorificato nel Figlio."],["Giovanni 14,14","Se mi chiederete qualche cosa nel mio nome, io la farò."],["Giovanni 14,15","Se mi amate, osserverete i miei comandamenti;"],["Giovanni 14,16","e io pregherò il Padre ed egli vi darà un altro Paràclito perché rimanga con voi per sempre,"],["Giovanni 14,17","lo Spirito della verità, che il mondo non può ricevere perché non lo vede e non lo conosce. Voi lo conoscete perché egli rimane presso di voi e sarà in voi."],["Giovanni 14,18","Non vi lascerò orfani: verrò da voi."],["Giovanni 14,21","Chi accoglie i miei comandamenti e li osserva, questi è colui che mi ama. Chi ama me sarà amato dal Padre mio e anch'io lo amerò e mi manifesterò a lui»."],["Giovanni 14,23","Gli rispose Gesù: «Se uno mi ama, osserverà la mia parola e il Padre mio lo amerà e noi verremo a lui e prenderemo dimora presso di lui."],["Giovanni 14,26","Ma il Paràclito, lo Spirito Santo che il Padre manderà nel mio nome, lui vi insegnerà ogni cosa e vi ricorderà tutto ciò che io vi ho detto."],["Giovanni 14,27","Vi lascio la pace, vi do la mia pace. Non come la dà il mondo, io la do a voi. Non sia turbato il vostro cuore e non abbia timore."],["Giovanni 14,6","Gli disse Gesù: «Io sono la via, la verità e la vita. Nessuno viene al Padre se non per mezzo di me."],["Giovanni 15,11","Vi ho detto queste cose perché la mia gioia sia in voi e la vostra gioia sia piena."],["Giovanni 15,12","Questo è il mio comandamento: che vi amiate gli uni gli altri come io ho amato voi."],["Giovanni 15,13","Nessuno ha un amore più grande di questo: dare la sua vita per i propri amici."],["Giovanni 15,14","Voi siete miei amici, se fate ciò che io vi comando."],["Giovanni 15,15","Non vi chiamo più servi, perché il servo non sa quello che fa il suo padrone; ma vi ho chiamato amici, perché tutto ciò che ho udito dal Padre mio l'ho fatto conoscere a voi."],["Giovanni 15,16","Non voi avete scelto me, ma io ho scelto voi e vi ho costituiti perché andiate e portiate frutto e il vostro frutto rimanga; perché tutto quello che chiederete al Padre nel mio nome, ve lo conceda."],["Giovanni 15,26","Quando verrà il Paràclito, che io vi manderò dal Padre, lo Spirito della verità che procede dal Padre, egli darà testimonianza di me;"],["Giovanni 15,5","Io sono la vite, voi i tralci. Chi rimane in me, e io in lui, porta molto frutto, perché senza di me non potete far nulla."],["Giovanni 15,7","Se rimanete in me e le mie parole rimangono in voi, chiedete quello che volete e vi sarà fatto."],["Giovanni 15,9","Come il Padre ha amato me, anche io ho amato voi. Rimanete nel mio amore."],["Giovanni 16,13","Quando verrà lui, lo Spirito della verità, vi guiderà a tutta la verità, perché non parlerà da se stesso, ma dirà tutto ciò che avrà udito e vi annuncerà le cose future."],["Giovanni 16,21","La donna, quando partorisce, è nel dolore, perché è venuta la sua ora; ma, quando ha dato alla luce il bambino, non si ricorda più della sofferenza, per la gioia che è venuto al mondo un uomo."],["Giovanni 16,22","Così anche voi, ora, siete nel dolore; ma vi vedrò di nuovo e il vostro cuore si rallegrerà e nessuno potrà togliervi la vostra gioia."],["Giovanni 16,23","Quel giorno non mi domanderete più nulla. In verità, in verità io vi dico: se chiederete qualche cosa al Padre nel mio nome, egli ve la darà."],["Giovanni 16,24","Finora non avete chiesto nulla nel mio nome. Chiedete e otterrete, perché la vostra gioia sia piena."],["Giovanni 16,27","il Padre stesso infatti vi ama, perché voi avete amato me e avete creduto che io sono uscito da Dio."],["Giovanni 16,33","Vi ho detto questo perché abbiate pace in me. Nel mondo avete tribolazioni, ma abbiate coraggio: io ho vinto il mondo!»."],["Giovanni 16,7","Ma io vi dico la verità: è bene per voi che io me ne vada, perché, se non me ne vado, non verrà a voi il Paràclito; se invece me ne vado, lo manderò a voi."],["Giovanni 17,17","Consacrali nella verità. La tua parola è verità."],["Giovanni 17,21","perché tutti siano una sola cosa; come tu, Padre, sei in me e io in te, siano anch'essi in noi, perché il mondo creda che tu mi hai mandato."],["Giovanni 17,23","Io in loro e tu in me, perché siano perfetti nell'unità e il mondo conosca che tu mi hai mandato e che li hai amati come hai amato me."],["Giovanni 17,3","Questa è la vita eterna: che conoscano te, l'unico vero Dio, e colui che hai mandato, Gesù Cristo."],["Giovanni 17,4-5","Io ti ho glorificato sulla terra, compiendo l'opera che mi hai dato da fare. E ora, Padre, glorificami davanti a te con quella gloria che io avevo presso di te prima che il mondo fosse."],["Giovanni 20,29","Gesù gli disse: «Perché mi hai veduto, tu hai creduto; beati quelli che non hanno visto e hanno creduto!»."],["Giovanni 20,31","Ma questi sono stati scritti perché crediate che Gesù è il Cristo, il Figlio di Dio, e perché, credendo, abbiate la vita nel suo nome."],["Giovanni 3,16","Dio infatti ha tanto amato il mondo da dare il Figlio unigenito, perché chiunque crede in lui non vada perduto, ma abbia la vita eterna."],["Giovanni 3,17","Dio, infatti, non ha mandato il Figlio nel mondo per condannare il mondo, ma perché il mondo sia salvato per mezzo di lui."],["Giovanni 3,27","Giovanni rispose: «Nessuno può prendersi qualcosa se non gli è stata data dal cielo."],["Giovanni 3,3","Gli rispose Gesù: «In verità, in verità io ti dico, se uno non nasce dall'alto, non può vedere il regno di Dio»."],["Giovanni 4,23-24","Ma viene l'ora - ed è questa - in cui i veri adoratori adoreranno il Padre in spirito e verità: così infatti il Padre vuole che siano quelli che lo adorano. Dio è spirito, e quelli che lo adorano devono adorare in spirito e verità»."],["Giovanni 4,34","Gesù disse loro: «Il mio cibo è fare la volontà di colui che mi ha mandato e compiere la sua opera."],["Giovanni 5,24","In verità, in verità io vi dico: chi ascolta la mia parola e crede a colui che mi ha mandato, ha la vita eterna e non va incontro al giudizio, ma è passato dalla morte alla vita."],["Giovanni 6,40","Questa infatti è la volontà del Padre mio: che chiunque vede il Figlio e crede in lui abbia la vita eterna; e io lo risusciterò nell'ultimo giorno»."],["Giovanni 6,44","Nessuno può venire a me, se non lo attira il Padre che mi ha mandato; e io lo risusciterò nell'ultimo giorno."],["Giovanni 6,47","In verità, in verità io vi dico: chi crede ha la vita eterna."],["Giovanni 8,12","Di nuovo Gesù parlò loro e disse: «Io sono la luce del mondo; chi segue me, non camminerà nelle tenebre, ma avrà la luce della vita»."],["Giovanni 8,32","conoscerete la verità e la verità vi farà liberi»."],["Giovanni 8,36","Se dunque il Figlio vi farà liberi, sarete liberi davvero."],["Giovanni 9,5","Finché io sono nel mondo, sono la luce del mondo»."],["Isaia 1,18","«Su, venite e discutiamo - dice il Signore. Anche se i vostri peccati fossero come scarlatto, diventeranno bianchi come neve. Se fossero rossi come porpora, diventeranno come lana."],["Isaia 1,19","Se sarete docili e ascolterete, mangerete i frutti della terra."],["Isaia 11,2","Su di lui si poserà lo spirito del Signore, spirito di sapienza e d'intelligenza, spirito di consiglio e di fortezza, spirito di conoscenza e di timore del Signore."],["Isaia 12,2","Ecco, Dio è la mia salvezza; io avrò fiducia, non avrò timore, perché mia forza e mio canto è il Signore; egli è stato la mia salvezza»."],["Isaia 25,1","Signore, tu sei il mio Dio; voglio esaltarti e lodare il tuo nome, perché hai eseguito progetti meravigliosi, concepiti da lungo tempo, fedeli e stabili."],["Isaia 25,4","Perché tu sei sostegno al misero, sostegno al povero nella sua angoscia, riparo dalla tempesta, ombra contro il caldo; poiché lo sbuffo dei tiranni è come pioggia che rimbalza sul muro,"],["Isaia 26,3","La sua volontà è salda; tu le assicurerai la pace, pace perché in te confida."],["Isaia 30,21","i tuoi orecchi sentiranno questa parola dietro di te: «Questa è la strada, percorretela», caso mai andiate a destra o a sinistra."],["Isaia 40,1","«Consolate, consolate il mio popolo - dice il vostro Dio."],["Isaia 40,11","Come un pastore egli fa pascolare il gregge e con il suo braccio lo raduna; porta gli agnellini sul petto e conduce dolcemente le pecore madri»."],["Isaia 40,26","Levate in alto i vostri occhi e guardate: chi ha creato tali cose? Egli fa uscire in numero preciso il loro esercito e le chiama tutte per nome; per la sua onnipotenza e il vigore della sua forza non ne manca alcuna."],["Isaia 40,29","Egli dà forza allo stanco e moltiplica il vigore allo spossato."],["Isaia 40,30","Anche i giovani faticano e si stancano, gli adulti inciampano e cadono;"],["Isaia 40,31","ma quanti sperano nel Signore riacquistano forza, mettono ali come aquile, corrono senza affannarsi, camminano senza stancarsi."],["Isaia 41,10","Non temere, perché io sono con te; non smarrirti, perché io sono il tuo Dio. Ti rendo forte e ti vengo in aiuto e ti sostengo con la destra della mia giustizia."],["Isaia 41,13","Poiché io sono il Signore, tuo Dio, che ti tengo per la destra e ti dico: «Non temere, io ti vengo in aiuto»."],["Isaia 42,1","Ecco il mio servo che io sostengo, il mio eletto di cui mi compiaccio. Ho posto il mio spirito su di lui; egli porterà il diritto alle nazioni."],["Isaia 42,6","«Io, il Signore, ti ho chiamato per la giustizia e ti ho preso per mano; ti ho formato e ti ho stabilito come alleanza del popolo e luce delle nazioni,"],["Isaia 42,8","Io sono il Signore: questo è il mio nome; non cederò la mia gloria ad altri, né il mio onore agli idoli."],["Isaia 43,18","«Non ricordate più le cose passate, non pensate più alle cose antiche!"],["Isaia 43,19","Ecco, io faccio una cosa nuova: proprio ora germoglia, non ve ne accorgete? Aprirò anche nel deserto una strada, immetterò fiumi nella steppa."],["Isaia 43,7","quelli che portano il mio nome e che per la mia gloria ho creato e plasmato e anche for
